<script>
(function () {
  const DURATION = 4.0;

  const figure = document.getElementById("figure");
  const headGroup = document.getElementById("headGroup");
  const bodyGroup = document.getElementById("bodyGroup");
  const waveArmGroup = document.getElementById("waveArmGroup");
  const waveMarks = document.getElementById("waveMarks");

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function easeOutCubic(x) {
    x = clamp(x, 0, 1);
    return 1 - Math.pow(1 - x, 3);
  }

  function easeInOutSine(x) {
    x = clamp(x, 0, 1);
    return 0.5 - 0.5 * Math.cos(Math.PI * x);
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    // At t=0 every value below is exactly zero/identity, preserving the source drawing.
    const wake = easeOutCubic(t / 0.45);

    // Cheerful body bounce: small vertical hop with a little side-to-side life.
    const bouncePhase = Math.sin(Math.PI * 2.0 * t);
    const bounceY = -5.0 * wake * bouncePhase * bouncePhase;
    const swayX = 1.4 * wake * Math.sin(Math.PI * 2.0 * t + Math.PI) * Math.sin(Math.PI * t / DURATION);

    figure.setAttribute("transform", "translate(" + swayX.toFixed(3) + " " + bounceY.toFixed(3) + ")");

    // Head follows the bounce with a tiny delayed nod.
    const headRot = 2.2 * wake * Math.sin(Math.PI * 2.0 * t - 0.35) * Math.sin(Math.PI * t / DURATION);
    const headLift = -1.2 * wake * Math.sin(Math.PI * 2.0 * t + 0.2) * Math.sin(Math.PI * t / DURATION);
    headGroup.setAttribute(
      "transform",
      "translate(0 " + headLift.toFixed(3) + ") rotate(" + headRot.toFixed(3) + " 256.5 167.5)"
    );

    // Body/legs squash very subtly on the downbeat, pivoting around the hip.
    const squash = 1 + 0.012 * wake * Math.max(0, Math.sin(Math.PI * 2.0 * t + Math.PI / 2));
    const stretch = 1 - 0.008 * wake * Math.max(0, Math.sin(Math.PI * 2.0 * t + Math.PI / 2));
    bodyGroup.setAttribute(
      "transform",
      "translate(256 320) scale(" + stretch.toFixed(4) + " " + squash.toFixed(4) + ") translate(-256 -320)"
    );

    // Raised arm waves around the shoulder at (256.2, 210.1).
    // Starts at 0 degrees exactly, then anticipates and swings in an overlapping rhythm.
    const startEnv = easeOutCubic(t / 0.55);
    const endEnv = easeInOutSine(clamp((DURATION - t) / 0.6, 0, 1));
    const env = startEnv * endEnv;

    const anticipation = (t < 0.32) ? (-5.0 * Math.sin(Math.PI * t / 0.32)) : 0;
    const wave = 13.5 * env * Math.sin(Math.PI * 2.7 * t);
    const flutter = 3.0 * env * Math.sin(Math.PI * 5.4 * t + 0.7);
    const armAngle = anticipation + wave + flutter;

    waveArmGroup.setAttribute(
      "transform",
      "rotate(" + armAngle.toFixed(3) + " 256.2 210.1)"
    );

    // Little hand wave marks pop on during the active waving only.
    const markPulse = Math.pow(Math.max(0, Math.sin(Math.PI * 2.7 * t - 0.35)), 0.8);
    const markEnv = clamp((t - 0.18) / 0.22, 0, 1) * clamp((DURATION - t) / 0.7, 0, 1);
    const markOpacity = 0.72 * markEnv * markPulse;

    // Keep marks near the moving hand by echoing a smaller rotation around the shoulder.
    waveMarks.setAttribute("opacity", markOpacity.toFixed(3));
    waveMarks.setAttribute(
      "transform",
      "rotate(" + (armAngle * 0.75).toFixed(3) + " 256.2 210.1)"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

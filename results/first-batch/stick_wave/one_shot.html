<script>
(function () {
  const DURATION = 4.0;

  const el = (id) => document.getElementById(id);

  const figure = el("figure");
  const headGroup = el("headGroup");
  const torsoGroup = el("torsoGroup");
  const legsGroup = el("legsGroup");
  const raisedArm = el("s4");
  const leftArm = el("s3");
  const helloLines = el("helloLines");
  const waveLine1 = el("waveLine1");
  const waveLine2 = el("waveLine2");
  const waveLine3 = el("waveLine3");

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function smoothstep(a, b, x) {
    x = clamp((x - a) / (b - a), 0, 1);
    return x * x * (3 - 2 * x);
  }

  function setTransform(node, value) {
    node.setAttribute("transform", value);
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    /*
      The first frame must be the original drawing.
      All animation envelopes are exactly 0 at t=0, so all transforms are identity.
    */
    const start = smoothstep(0.0, 0.45, t);
    const finish = 1 - smoothstep(3.45, 4.0, t);
    const env = start * finish;

    // Cheerful body bounce: a small vertical lift and settle, driven by the torso/feet rhythm.
    const bounce = env * (
      -5.0 * Math.abs(Math.sin(Math.PI * 1.55 * t)) +
       1.2 * Math.sin(Math.PI * 3.10 * t)
    );

    // Tiny side sway so the stick figure feels alive, pivoting around the hip.
    const sway = env * (1.6 * Math.sin(Math.PI * 1.55 * t + 0.25));

    // Raised arm waves around the shoulder. It starts exactly at zero rotation.
    const wave =
      env * (
        12.0 * Math.sin(Math.PI * 4.2 * t) +
         3.0 * Math.sin(Math.PI * 8.4 * t + 0.4)
      );

    // Slight sympathetic motions with overlap.
    const headTilt = env * (-2.0 * Math.sin(Math.PI * 1.55 * t + 0.55));
    const torsoSquash = 1 + env * (0.012 * Math.sin(Math.PI * 3.10 * t + Math.PI));
    const leftArmFollow = env * (1.8 * Math.sin(Math.PI * 1.55 * t + 1.2));
    const legCounter = env * (-0.7 * Math.sin(Math.PI * 1.55 * t));

    if (t === 0) {
      setTransform(figure, "");
      setTransform(headGroup, "");
      setTransform(torsoGroup, "");
      setTransform(legsGroup, "");
      setTransform(raisedArm, "");
      setTransform(leftArm, "");
      helloLines.setAttribute("opacity", "0");
      setTransform(helloLines, "");
      return;
    }

    setTransform(
      figure,
      "translate(0 " + bounce.toFixed(3) + ") rotate(" + sway.toFixed(3) + " 256 321)"
    );

    setTransform(
      headGroup,
      "rotate(" + headTilt.toFixed(3) + " 256 168)"
    );

    setTransform(
      torsoGroup,
      "translate(0 " + (-0.5 * env * Math.sin(Math.PI * 3.10 * t)).toFixed(3) + ") " +
      "scale(1 " + torsoSquash.toFixed(4) + ")"
    );

    setTransform(
      legsGroup,
      "rotate(" + legCounter.toFixed(3) + " 256 320)"
    );

    setTransform(
      leftArm,
      "rotate(" + leftArmFollow.toFixed(3) + " 255.3 210.1)"
    );

    setTransform(
      raisedArm,
      "rotate(" + wave.toFixed(3) + " 256.2 210.1)"
    );

    // Hand-drawn hello motion arcs near the raised hand, flickering with the wave.
    const linePulse = env * (0.35 + 0.65 * Math.max(0, Math.sin(Math.PI * 4.2 * t + 0.2)));
    const lineOpacity = clamp(linePulse, 0, 0.85);
    helloLines.setAttribute("opacity", lineOpacity.toFixed(3));

    const lineWobble = env * (2.5 * Math.sin(Math.PI * 4.2 * t + 0.7));
    setTransform(
      helloLines,
      "rotate(" + lineWobble.toFixed(3) + " 342 104)"
    );

    // Give the three little arcs slightly offset visibility, like sketched motion ticks.
    waveLine1.setAttribute("opacity", clamp(lineOpacity * (0.75 + 0.25 * Math.sin(Math.PI * 4.2 * t)), 0, 1).toFixed(3));
    waveLine2.setAttribute("opacity", clamp(lineOpacity * (0.85 + 0.15 * Math.sin(Math.PI * 4.2 * t + 1.4)), 0, 1).toFixed(3));
    waveLine3.setAttribute("opacity", clamp(lineOpacity * (0.65 + 0.35 * Math.sin(Math.PI * 4.2 * t + 2.6)), 0, 1).toFixed(3));
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

<script>
(function () {
  const DURATION = 4.0;
  const figure = document.getElementById("figure");
  const headGroup = document.getElementById("headGroup");
  const raisedArm = document.getElementById("raisedArm");
  const waveMarks = document.getElementById("waveMarks");

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function smoothstep(a, b, x) {
    x = clamp((x - a) / (b - a), 0, 1);
    return x * x * (3 - 2 * x);
  }

  window.ksaRender = function(t) {
    t = clamp(t, 0, DURATION);

    // Smoothly enters and leaves so t=0 is exactly the supplied drawing.
    const inEnv = smoothstep(0.0, 0.45, t);
    const outEnv = 1.0 - smoothstep(3.45, 4.0, t);
    const env = inEnv * outEnv;

    // A friendly little body bounce, synced to the waving energy.
    const bounce = env * (-4.0 * Math.abs(Math.sin(Math.PI * 1.85 * t)));
    const squash = 1 + env * 0.012 * Math.sin(Math.PI * 3.7 * t);
    figure.setAttribute(
      "transform",
      "translate(0 " + bounce.toFixed(3) + ") " +
      "translate(256 441) scale(" + (1 / squash).toFixed(4) + " " + squash.toFixed(4) + ") translate(-256 -441)"
    );

    // Raised arm waves around the shoulder joint at roughly (256.2, 210.1).
    // Includes a tiny anticipation dip before swinging outward.
    const wave = Math.sin(Math.PI * 2 * 1.45 * t);
    const follow = 0.35 * Math.sin(Math.PI * 2 * 2.9 * t + 0.9);
    const anticipation = -5.0 * smoothstep(0.05, 0.25, t) * (1 - smoothstep(0.25, 0.45, t));
    const armAngle = env * (anticipation + 13.5 * wave + 4.0 * follow);
    raisedArm.setAttribute("transform", "rotate(" + armAngle.toFixed(3) + " 256.2 210.1)");

    // Subtle head bob/follow-through, pivoting at the neck.
    const headAngle = env * (1.7 * Math.sin(Math.PI * 2 * 1.85 * t + 0.5));
    headGroup.setAttribute("transform", "rotate(" + headAngle.toFixed(3) + " 256.5 167.5)");

    // Cartoon wave marks appear only during the active hello gesture.
    const markPulse = env * (0.35 + 0.65 * Math.abs(Math.sin(Math.PI * 2 * 1.45 * t)));
    waveMarks.setAttribute("opacity", markPulse.toFixed(3));
    waveMarks.setAttribute(
      "transform",
      "translate(" + (env * 2.0 * Math.sin(Math.PI * 2 * 1.45 * t)).toFixed(3) + " " +
                    (env * -1.0 * Math.abs(Math.sin(Math.PI * 2 * 1.45 * t))).toFixed(3) + ")"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

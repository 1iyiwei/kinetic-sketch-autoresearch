<script>
(function () {
  const rocket = document.getElementById("rocket");
  const flame = document.getElementById("s5");
  const effects = document.getElementById("effects");
  const ex1 = document.getElementById("ex1");
  const ex2 = document.getElementById("ex2");
  const ex3 = document.getElementById("ex3");
  const smoke1 = document.getElementById("smoke1");
  const smoke2 = document.getElementById("smoke2");

  const originalFlameD = "M225.5,335.9 L226.7,340.6 L227.4,345.3 L229.0,349.7 L230.2,354.7 L230.6,359.6 L232.0,364.7 L232.5,370.5 L234.2,376.1 L234.8,380.6 L235.4,385.8 L236.4,390.1 L237.7,395.6 L239.5,400.1 L240.3,397.6 L241.8,394.7 L242.6,390.8 L244.3,387.6 L245.0,385.2 L246.7,382.4 L247.5,379.7 L248.3,376.9 L249.8,373.3 L251.3,370.6 L252.4,366.7 L253.9,363.2 L254.8,359.6 L255.6,363.1 L256.9,366.8 L258.8,370.5 L260.2,374.1 L261.4,377.5 L262.4,381.0 L264.2,385.3 L265.0,389.5 L267.1,393.0 L268.7,397.1 L269.9,401.7 L270.9,405.7 L272.4,410.3 L273.1,405.0 L274.5,399.4 L275.4,393.3 L275.8,387.0 L276.3,381.7 L277.3,375.5 L278.0,370.4 L279.9,364.9 L280.8,358.7 L281.8,353.0 L282.6,347.2 L283.5,342.2 L285.6,336.5";

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function smoothstep(x) { x = clamp(x, 0, 1); return x * x * (3 - 2 * x); }
  function easeInQuad(x) { return x * x; }
  function easeInCubic(x) { return x * x * x; }

  window.ksaRender = function(t) {
    t = clamp(t, 0, 4.0);

    let x = 0, y = 0, rot = 0;
    let sx = 1, sy = 1;

    if (t <= 1.55) {
      const build = smoothstep(t / 1.55);
      const amp = 0.15 + 2.2 * build;
      x = Math.sin(t * 64) * amp + Math.sin(t * 113) * amp * 0.35;
      y = Math.sin(t * 89 + 1.1) * amp * 0.55;
      rot = Math.sin(t * 42) * (0.25 + 1.2 * build);
      sx = 1 + Math.sin(t * 52) * 0.004 * build;
      sy = 1 - Math.sin(t * 52) * 0.006 * build;
    } else {
      const u = clamp((t - 1.55) / 2.45, 0, 1);
      const anticipation = Math.max(0, 1 - u / 0.13);
      const lift = easeInCubic(u);
      y = 8 * anticipation - 760 * lift;
      x = Math.sin(u * Math.PI * 1.4) * 18 * smoothstep(u) + Math.sin(t * 14) * 1.2 * (1 - u);
      rot = -3.5 * smoothstep(u) + Math.sin(t * 20) * 0.8 * (1 - u);
      sx = 1 - 0.03 * anticipation + 0.015 * smoothstep(u);
      sy = 1 + 0.06 * anticipation;
    }

    rocket.setAttribute("transform",
      "translate(" + x.toFixed(3) + " " + y.toFixed(3) + ") " +
      "rotate(" + rot.toFixed(3) + " 256 330) " +
      "translate(256 330) scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(-256 -330)"
    );

    if (t === 0) {
      flame.setAttribute("d", originalFlameD);
      effects.setAttribute("opacity", "0");
      ex1.setAttribute("transform", "");
      ex2.setAttribute("transform", "");
      ex3.setAttribute("transform", "");
      smoke1.setAttribute("transform", "");
      smoke2.setAttribute("transform", "");
      return;
    }

    const flick = Math.sin(t * 38) * 0.5 + Math.sin(t * 71 + 0.7) * 0.5;
    const launch = smoothstep((t - 1.35) / 0.55);
    const extra = 10 + 22 * launch + 8 * flick;
    const centerDrop = 8 + 30 * launch + 7 * Math.sin(t * 59);
    const sideDrop = 5 + 18 * launch + 5 * Math.sin(t * 47 + 1.4);

    flame.setAttribute("d",
      "M225.5,335.9 L226.7,340.6 L227.4,345.3 L229.0,349.7 L230.2,354.7 L230.6,359.6 L232.0,364.7 L232.5,370.5 L234.2,376.1 L234.8,380.6 L235.4,385.8 L236.4,390.1 L237.7,395.6 L239.5," + (400.1 + sideDrop).toFixed(1) +
      " L240.3,397.6 L241.8,394.7 L242.6,390.8 L244.3,387.6 L245.0,385.2 L246.7,382.4 L247.5,379.7 L248.3,376.9 L249.8,373.3 L251.3,370.6 L252.4,366.7 L253.9,363.2 L254.8,359.6 L255.6,363.1 L256.9,366.8 L258.8,370.5 L260.2,374.1 L261.4,377.5 L262.4,381.0 L264.2,385.3 L265.0,389.5 L267.1,393.0 L268.7,397.1 L269.9,401.7 L270.9,405.7 L272.4," + (410.3 + centerDrop).toFixed(1) +
      " L273.1,405.0 L274.5,399.4 L275.4,393.3 L275.8,387.0 L276.3,381.7 L277.3,375.5 L278.0,370.4 L279.9,364.9 L280.8,358.7 L281.8,353.0 L282.6,347.2 L283.5,342.2 L285.6,336.5"
    );

    const e = smoothstep((t - 1.45) / 0.8);
    const fade = t > 3.0 ? 1 - smoothstep((t - 3.0) / 1.0) : 1;
    effects.setAttribute("opacity", (e * fade).toFixed(3));

    ex1.setAttribute("transform", "translate(" + (Math.sin(t*22)*3).toFixed(2) + " " + (y*0.18).toFixed(2) + ") scale(1 " + (1 + launch*0.9 + 0.08*Math.sin(t*31)).toFixed(3) + ")");
    ex2.setAttribute("transform", "translate(" + (Math.sin(t*19+1)*2).toFixed(2) + " " + (y*0.18).toFixed(2) + ") scale(1 " + (1 + launch*1.15 + 0.1*Math.sin(t*37)).toFixed(3) + ")");
    ex3.setAttribute("transform", "translate(" + (Math.sin(t*24+2)*3).toFixed(2) + " " + (y*0.18).toFixed(2) + ") scale(1 " + (1 + launch*0.85 + 0.08*Math.sin(t*29)).toFixed(3) + ")");

    const sm = smoothstep((t - 1.65) / 1.2);
    smoke1.setAttribute("transform", "translate(" + (-20 * sm).toFixed(2) + " " + (-12 * sm).toFixed(2) + ") scale(" + (1 + 0.35*sm).toFixed(3) + " " + (1 + 0.22*sm).toFixed(3) + ")");
    smoke2.setAttribute("transform", "translate(" + (18 * sm).toFixed(2) + " " + (-10 * sm).toFixed(2) + ") scale(" + (1 + 0.38*sm).toFixed(3) + " " + (1 + 0.20*sm).toFixed(3) + ")");
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

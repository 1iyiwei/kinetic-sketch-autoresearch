</svg>

<script>
(function () {
  const rocket = document.getElementById("rocket");
  const flame = document.getElementById("flame");
  const s5 = document.getElementById("s5");

  const smoke1 = document.getElementById("smoke1");
  const smoke2 = document.getElementById("smoke2");
  const blast1 = document.getElementById("blast1");
  const blast2 = document.getElementById("blast2");
  const blast3 = document.getElementById("blast3");
  const speedL = document.getElementById("speedL");
  const speedR = document.getElementById("speedR");

  const originalFlameD = "M225.5,335.9 L226.7,340.6 L227.4,345.3 L229.0,349.7 L230.2,354.7 L230.6,359.6 L232.0,364.7 L232.5,370.5 L234.2,376.1 L234.8,380.6 L235.4,385.8 L236.4,390.1 L237.7,395.6 L239.5,400.1 L240.3,397.6 L241.8,394.7 L242.6,390.8 L244.3,387.6 L245.0,385.2 L246.7,382.4 L247.5,379.7 L248.3,376.9 L249.8,373.3 L251.3,370.6 L252.4,366.7 L253.9,363.2 L254.8,359.6 L255.6,363.1 L256.9,366.8 L258.8,370.5 L260.2,374.1 L261.4,377.5 L262.4,381.0 L264.2,385.3 L265.0,389.5 L267.1,393.0 L268.7,397.1 L269.9,401.7 L270.9,405.7 L272.4,410.3 L273.1,405.0 L274.5,399.4 L275.4,393.3 L275.8,387.0 L276.3,381.7 L277.3,375.5 L278.0,370.4 L279.9,364.9 L280.8,358.7 L281.8,353.0 L282.6,347.2 L283.5,342.2 L285.6,336.5";

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function easeInQuad(x) {
    return x * x;
  }

  function easeOutCubic(x) {
    return 1 - Math.pow(1 - x, 3);
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function setOpacity(el, v) {
    el.setAttribute("opacity", String(clamp(v, 0, 1)));
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, 4.0);

    if (t === 0) {
      rocket.setAttribute("transform", "");
      flame.setAttribute("transform", "");
      s5.setAttribute("d", originalFlameD);
      setOpacity(smoke1, 0);
      setOpacity(smoke2, 0);
      setOpacity(blast1, 0);
      setOpacity(blast2, 0);
      setOpacity(blast3, 0);
      setOpacity(speedL, 0);
      setOpacity(speedR, 0);
      return;
    }

    const launchStart = 1.45;
    let x = 0;
    let y = 0;
    let rot = 0;
    let sx = 1;
    let sy = 1;

    if (t < launchStart) {
      const build = smoothstep(t / launchStart);
      x = Math.sin(t * 58) * 2.0 * build + Math.sin(t * 97) * 0.8 * build;
      y = Math.sin(t * 72) * 1.6 * build;
      rot = Math.sin(t * 45) * 1.4 * build;
      sx = 1 + 0.008 * Math.sin(t * 60) * build;
      sy = 1 - 0.006 * Math.sin(t * 60) * build;
    } else {
      const u = clamp((t - launchStart) / (4.0 - launchStart), 0, 1);
      const accel = easeInQuad(u);
      const wobble = Math.exp(-u * 3.2);
      y = -670 * accel;
      x = Math.sin(u * Math.PI * 2.1) * 10 * wobble;
      rot = Math.sin(u * Math.PI * 3.2) * 4.5 * wobble;
      const kick = Math.max(0, 1 - u * 4);
      sy = 1 + 0.035 * kick;
      sx = 1 - 0.018 * kick;
    }

    rocket.setAttribute(
      "transform",
      "translate(" + x.toFixed(3) + " " + y.toFixed(3) + ") rotate(" + rot.toFixed(3) + " 256 330) scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ")"
    );

    const intensity = t < launchStart
      ? 0.35 + 0.65 * smoothstep(t / launchStart)
      : 1.4;

    const flicker = Math.sin(t * 41.0) * 0.08 + Math.sin(t * 73.0) * 0.05;
    const flameScaleY = 1 + intensity * (0.16 + flicker);
    const flameScaleX = 1 + intensity * (0.035 * Math.sin(t * 65.0));
    flame.setAttribute(
      "transform",
      "translate(255.5 336) scale(" + flameScaleX.toFixed(4) + " " + flameScaleY.toFixed(4) + ") translate(-255.5 -336)"
    );

    s5.setAttribute("d", originalFlameD);

    const blast = t < launchStart
      ? smoothstep(t / launchStart) * 0.45
      : Math.max(0, 1 - (t - launchStart) / 1.15);

    setOpacity(blast1, blast * (0.6 + 0.4 * Math.abs(Math.sin(t * 37))));
    setOpacity(blast2, blast * (0.7 + 0.3 * Math.abs(Math.sin(t * 43))));
    setOpacity(blast3, blast * (0.6 + 0.4 * Math.abs(Math.sin(t * 31))));

    const blastLen = 1 + blast * 0.45;
    blast1.setAttribute("transform", "translate(0 " + (8 * blast).toFixed(2) + ") scale(1 " + blastLen.toFixed(3) + ")");
    blast2.setAttribute("transform", "translate(0 " + (11 * blast).toFixed(2) + ") scale(1 " + (blastLen + 0.15).toFixed(3) + ")");
    blast3.setAttribute("transform", "translate(0 " + (8 * blast).toFixed(2) + ") scale(1 " + blastLen.toFixed(3) + ")");

    const smokeU = clamp((t - 1.15) / 1.8, 0, 1);
    const smokeOp = smokeU * (1 - clamp((t - 2.7) / 1.0, 0, 1)) * 0.8;
    setOpacity(smoke1, smokeOp);
    setOpacity(smoke2, smokeOp);
    smoke1.setAttribute("transform", "translate(" + (-12 * smokeU).toFixed(2) + " " + (10 * smokeU).toFixed(2) + ") scale(" + (1 + 0.55 * smokeU).toFixed(3) + ")");
    smoke2.setAttribute("transform", "translate(" + (12 * smokeU).toFixed(2) + " " + (10 * smokeU).toFixed(2) + ") scale(" + (1 + 0.55 * smokeU).toFixed(3) + ")");

    const speedU = clamp((t - 1.9) / 0.5, 0, 1) * (1 - clamp((t - 3.4) / 0.5, 0, 1));
    setOpacity(speedL, speedU * 0.75);
    setOpacity(speedR, speedU * 0.75);
    speedL.setAttribute("transform", "translate(0 " + ((t * 90) % 34).toFixed(2) + ")");
    speedR.setAttribute("transform", "translate(0 " + ((t * 90) % 34).toFixed(2) + ")");
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

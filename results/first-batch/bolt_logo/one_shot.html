<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cloud Lightning Logo Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 512px;
      height: 512px;
      background: #f1f3f5;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="boltClip">
      <rect id="boltClipRect" x="0" y="0" width="512" height="512"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#f1f3f5"/>

  <g id="flashGroup" opacity="0">
    <circle id="flashCircle" cx="256" cy="260" r="20" fill="#fff3bf"/>
    <path id="ray1" d="M256 132 L256 92" stroke="#fcc419" stroke-width="8" stroke-linecap="round"/>
    <path id="ray2" d="M331 168 L363 136" stroke="#fcc419" stroke-width="8" stroke-linecap="round"/>
    <path id="ray3" d="M181 168 L149 136" stroke="#fcc419" stroke-width="8" stroke-linecap="round"/>
    <path id="ray4" d="M347 272 L392 272" stroke="#fcc419" stroke-width="8" stroke-linecap="round"/>
    <path id="ray5" d="M165 272 L120 272" stroke="#fcc419" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g id="cloudGroup">
    <path id="p1" d="M150 250 C 120 250, 110 200, 150 190 C 150 140, 220 130, 240 170 C 270 130, 350 150, 340 200 C 390 200, 390 250, 350 250 Z" fill="#868e96"/>
  </g>

  <g id="boltGroup" clip-path="url(#boltClip)">
    <polygon id="p2" points="250,240 200,350 245,350 220,440 310,320 262,320 290,240" fill="#fcc419"/>
  </g>

  <g id="dustGroup" opacity="0">
    <circle id="dust1" cx="215" cy="356" r="3" fill="#ffd43b"/>
    <circle id="dust2" cx="235" cy="365" r="2.5" fill="#ffd43b"/>
    <circle id="dust3" cx="295" cy="332" r="3" fill="#ffd43b"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const cloudGroup = document.getElementById("cloudGroup");
  const boltGroup = document.getElementById("boltGroup");
  const boltClipRect = document.getElementById("boltClipRect");
  const flashGroup = document.getElementById("flashGroup");
  const flashCircle = document.getElementById("flashCircle");
  const dustGroup = document.getElementById("dustGroup");

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function easeOutCubic(x) {
    x = clamp(x, 0, 1);
    return 1 - Math.pow(1 - x, 3);
  }

  function easeOutBack(x) {
    x = clamp(x, 0, 1);
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function setTransform(el, value) {
    if (value && value.length) el.setAttribute("transform", value);
    else el.removeAttribute("transform");
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    if (t >= DURATION) {
      setTransform(cloudGroup, "");
      setTransform(boltGroup, "");
      boltClipRect.setAttribute("x", "0");
      boltClipRect.setAttribute("y", "0");
      boltClipRect.setAttribute("width", "512");
      boltClipRect.setAttribute("height", "512");
      flashGroup.setAttribute("opacity", "0");
      dustGroup.setAttribute("opacity", "0");
      return;
    }

    /* Cloud: drifts in from the left, overshoots, then softly settles. */
    let cloudX = 0;
    let cloudY = 0;
    let cloudScaleX = 1;
    let cloudScaleY = 1;

    if (t < 1.45) {
      const u = easeOutBack(t / 1.45);
      cloudX = -245 * (1 - u);
      cloudY = -8 * Math.sin(u * Math.PI);
      cloudScaleX = 1 + 0.035 * Math.sin(u * Math.PI);
      cloudScaleY = 1 - 0.025 * Math.sin(u * Math.PI);
    } else if (t < 2.6) {
      const u = t - 1.45;
      const amp = Math.exp(-2.6 * u);
      cloudX = Math.sin(u * 13.5) * 9 * amp;
      cloudY = Math.cos(u * 11.5) * 4 * amp;
      cloudScaleX = 1 + Math.sin(u * 13.5) * 0.012 * amp;
      cloudScaleY = 1 - Math.sin(u * 13.5) * 0.009 * amp;
    }

    const cloudTransform =
      "translate(245 210) " +
      "translate(" + cloudX.toFixed(3) + " " + cloudY.toFixed(3) + ") " +
      "scale(" + cloudScaleX.toFixed(4) + " " + cloudScaleY.toFixed(4) + ") " +
      "translate(-245 -210)";
    setTransform(cloudGroup, cloudTransform);

    /* Bolt: held above/invisible, then strikes down with a clipped reveal. */
    let boltOpacity = 1;
    let clipY = 512;
    let clipH = 0;
    let boltTx = 0;
    let boltTy = 0;
    let boltRot = 0;
    let boltScaleY = 1;

    if (t < 1.15) {
      boltOpacity = 0;
      clipY = 512;
      clipH = 0;
      boltTy = -42;
    } else if (t < 1.62) {
      const u = easeOutCubic((t - 1.15) / 0.47);
      boltOpacity = 1;
      clipY = 240;
      clipH = 205 * u;
      boltTy = -65 * (1 - u);
      boltScaleY = 1 + 0.08 * (1 - u);
    } else if (t < 2.75) {
      clipY = 0;
      clipH = 512;
      const u = t - 1.62;
      const amp = Math.exp(-3.1 * u);
      boltTx = Math.sin(u * 32) * 7 * amp;
      boltTy = Math.cos(u * 24) * 5 * amp;
      boltRot = Math.sin(u * 28) * 4.5 * amp;
      boltScaleY = 1 - Math.cos(u * 22) * 0.035 * amp;
    } else {
      clipY = 0;
      clipH = 512;
    }

    boltGroup.setAttribute("opacity", boltOpacity.toFixed(3));
    boltClipRect.setAttribute("x", "0");
    boltClipRect.setAttribute("y", clipY.toFixed(3));
    boltClipRect.setAttribute("width", "512");
    boltClipRect.setAttribute("height", clipH.toFixed(3));

    const boltTransform =
      "translate(255 340) " +
      "translate(" + boltTx.toFixed(3) + " " + boltTy.toFixed(3) + ") " +
      "rotate(" + boltRot.toFixed(3) + ") " +
      "scale(1 " + boltScaleY.toFixed(4) + ") " +
      "translate(-255 -340)";
    setTransform(boltGroup, boltTransform);

    /* Flash burst at the moment of impact. */
    let flashOpacity = 0;
    let flashScale = 1;
    if (t >= 1.44 && t <= 2.05) {
      const u = (t - 1.44) / 0.61;
      flashOpacity = Math.sin(clamp(u, 0, 1) * Math.PI) * 0.85;
      flashScale = 0.65 + 1.25 * smoothstep(u);
    }
    flashGroup.setAttribute("opacity", flashOpacity.toFixed(3));
    setTransform(
      flashGroup,
      "translate(256 260) scale(" + flashScale.toFixed(3) + ") translate(-256 -260)"
    );
    flashCircle.setAttribute("r", (18 + 42 * flashScale).toFixed(2));

    /* Tiny yellow settling flecks, gone by the final logo frame. */
    let dustOpacity = 0;
    let dustY = 0;
    if (t >= 1.62 && t <= 2.45) {
      const u = (t - 1.62) / 0.83;
      dustOpacity = Math.sin(u * Math.PI) * 0.55;
      dustY = -18 * u;
    }
    dustGroup.setAttribute("opacity", dustOpacity.toFixed(3));
    setTransform(dustGroup, "translate(0 " + dustY.toFixed(3) + ")");
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sun Logo Intro</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #fff8e7;
    }
    svg {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
  <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
    <rect width="512" height="512" fill="#fff8e7"/>
    <g id="logo">
      <circle id="p1" cx="256" cy="256" r="86" fill="#f59f00"/>
      <polygon id="p2" points="367.1,241.5 446.0,256.0 367.1,270.5" fill="#fab005"/>
      <polygon id="p3" points="344.8,324.3 390.4,390.4 324.3,344.8" fill="#fab005"/>
      <polygon id="p4" points="270.5,367.1 256.0,446.0 241.5,367.1" fill="#fab005"/>
      <polygon id="p5" points="187.7,344.8 121.6,390.4 167.2,324.3" fill="#fab005"/>
      <polygon id="p6" points="144.9,270.5 66.0,256.0 144.9,241.5" fill="#fab005"/>
      <polygon id="p7" points="167.2,187.7 121.6,121.6 187.7,167.2" fill="#fab005"/>
      <polygon id="p8" points="241.5,144.9 256.0,66.0 270.5,144.9" fill="#fab005"/>
      <polygon id="p9" points="324.3,167.2 390.4,121.6 344.8,187.7" fill="#fab005"/>
    </g>
  </svg>

  <script>
    const DURATION = 4.0;

    const logo = document.getElementById("logo");
    const sun = document.getElementById("p1");
    const rays = [
      document.getElementById("p2"),
      document.getElementById("p3"),
      document.getElementById("p4"),
      document.getElementById("p5"),
      document.getElementById("p6"),
      document.getElementById("p7"),
      document.getElementById("p8"),
      document.getElementById("p9")
    ];

    function clamp01(x) {
      return Math.max(0, Math.min(1, x));
    }

    function easeOutCubic(x) {
      x = clamp01(x);
      return 1 - Math.pow(1 - x, 3);
    }

    function easeInOutSine(x) {
      x = clamp01(x);
      return -(Math.cos(Math.PI * x) - 1) / 2;
    }

    function backOut(x) {
      x = clamp01(x);
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    function popScale(local) {
      local = clamp01(local);
      // Quick cartoon pop: overshoot, then settle.
      if (local < 0.72) {
        return backOut(local / 0.72);
      }
      const u = (local - 0.72) / 0.28;
      const wobble = Math.sin(u * Math.PI) * 0.055 * (1 - u);
      return 1 + wobble;
    }

    function centerScale(s) {
      return `translate(256 256) scale(${s}) translate(-256 -256)`;
    }

    function centerScaleRotate(s, r) {
      return `translate(256 256) rotate(${r}) scale(${s}) translate(-256 -256)`;
    }

    window.ksaRender = (t) => {
      t = Math.max(0, Math.min(DURATION, t));

      // Final anchor: exactly the supplied drawing.
      if (t >= DURATION) {
        logo.removeAttribute("transform");
        sun.removeAttribute("transform");
        sun.setAttribute("opacity", "1");
        rays.forEach(ray => {
          ray.removeAttribute("transform");
          ray.setAttribute("opacity", "1");
        });
        return;
      }

      // --- Sun disc builds first ---
      const sunStart = 0.08;
      const sunDur = 0.88;
      const su = clamp01((t - sunStart) / sunDur);
      let sunS = 0;
      if (su > 0) {
        // A rounded scale-up from nothing with a soft overshoot.
        sunS = popScale(su);
      }
      sun.setAttribute("opacity", su <= 0 ? "0" : "1");
      sun.setAttribute("transform", centerScale(sunS));

      // --- Rays pop in one by one clockwise from the right ray ---
      const rayStart = 0.78;
      const step = 0.155;
      const rayDur = 0.52;

      rays.forEach((ray, i) => {
        const local = clamp01((t - (rayStart + i * step)) / rayDur);
        if (local <= 0) {
          ray.setAttribute("opacity", "0");
          ray.setAttribute("transform", centerScale(0.001));
        } else {
          const s = popScale(local);
          const twist = (1 - easeOutCubic(local)) * (i % 2 === 0 ? -8 : 8);
          ray.setAttribute("opacity", String(easeOutCubic(local)));
          ray.setAttribute("transform", centerScaleRotate(s, twist));
        }
      });

      // --- Whole logo settling pulse after construction ---
      // Starts after the last rays arrive; damped, gentle breathing motion.
      const settleStart = 2.28;
      let wholeS = 1;
      if (t > settleStart) {
        const u = clamp01((t - settleStart) / (DURATION - settleStart));
        const decay = Math.pow(1 - u, 2.1);
        const wave = Math.sin(u * Math.PI * 4.0);
        wholeS = 1 + wave * 0.025 * decay;

        // A tiny initial buoyant lift that vanishes before the final frame.
        const lift = -3.0 * Math.sin(Math.PI * u) * Math.pow(1 - u, 1.7);
        logo.setAttribute(
          "transform",
          `translate(256 256) scale(${wholeS}) translate(-256 -256) translate(0 ${lift})`
        );
      } else {
        logo.removeAttribute("transform");
      }
    };

    window.ksaRender(0);
  </script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=512, height=512, initial-scale=1.0" />
<title>Heart Logo Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  #stage {
    width: 512px;
    height: 512px;
    display: block;
  }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>

  <defs>
    <clipPath id="heartClip">
      <path d="M256 400 C 120 310, 96 220, 150 170 C 196 128, 244 150, 256 190 C 268 150, 316 128, 362 170 C 416 220, 392 310, 256 400 Z"/>
    </clipPath>
  </defs>

  <g id="heartGroup">
    <path id="p1" d="M256 400 C 120 310, 96 220, 150 170 C 196 128, 244 150, 256 190 C 268 150, 316 128, 362 170 C 416 220, 392 310, 256 400 Z" fill="#e03131"/>
    <path id="p2" d="M176 196 C 186 176, 206 168, 222 172" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Added animation-only elements, invisible at t=0 -->
  <g id="glintGroup" clip-path="url(#heartClip)" opacity="0">
    <path id="glint" d="M176 196 C 186 176, 206 168, 222 172"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"
          stroke-dasharray="22 90" stroke-dashoffset="0"/>
  </g>

  <g id="spark" opacity="0" transform="translate(224 173) scale(1)">
    <path d="M0 -12 L3 -3 L12 0 L3 3 L0 12 L-3 3 L-12 0 L-3 -3 Z"
          fill="#ffffff"/>
  </g>
</svg>

<script>
(function () {
  const heartGroup = document.getElementById("heartGroup");
  const p1 = document.getElementById("p1");
  const p2 = document.getElementById("p2");
  const glintGroup = document.getElementById("glintGroup");
  const glint = document.getElementById("glint");
  const spark = document.getElementById("spark");

  const DURATION = 4.0;

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function smoothstep(a, b, x) {
    x = clamp((x - a) / (b - a), 0, 1);
    return x * x * (3 - 2 * x);
  }

  function pulseShape(t, start, len, amp) {
    const u = clamp((t - start) / len, 0, 1);
    if (u <= 0 || u >= 1) return 0;
    // A quick cartoon heartbeat: fast swell, slight undershoot, soft settle.
    const swell = Math.sin(Math.PI * clamp(u / 0.38, 0, 1));
    const settle = Math.sin(Math.PI * clamp((u - 0.38) / 0.62, 0, 1));
    return amp * (swell - 0.28 * settle);
  }

  function hexRed(v) {
    v = Math.round(clamp(v, 0, 255));
    return v.toString(16).padStart(2, "0");
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    // Anchor frame: exactly the original drawing at t=0.
    if (t === 0) {
      heartGroup.setAttribute("transform", "");
      p1.setAttribute("fill", "#e03131");
      p2.setAttribute("stroke-width", "10");
      glintGroup.setAttribute("opacity", "0");
      spark.setAttribute("opacity", "0");
      return;
    }

    // Double pulse: two close beats with anticipation, squash/stretch and settling.
    const beat1 = pulseShape(t, 0.48, 0.42, 0.125);
    const beat2 = pulseShape(t, 0.88, 0.38, 0.095);

    // A tiny residual wobble after the double beat.
    const tailStart = 1.15;
    const tail = t > tailStart
      ? Math.exp(-(t - tailStart) * 4.2) * Math.sin((t - tailStart) * 22) * 0.018
      : 0;

    const s = 1 + beat1 + beat2 + tail;

    // Slight vertical squash/stretch keeps it logo-like but lively.
    const sx = 1 + (s - 1) * 0.82;
    const sy = 1 + (s - 1) * 1.08;

    // Pivot visually around the heart's center mass.
    const cx = 256;
    const cy = 276;

    heartGroup.setAttribute(
      "transform",
      `translate(${cx} ${cy}) scale(${sx.toFixed(5)} ${sy.toFixed(5)}) translate(${-cx} ${-cy})`
    );

    // Subtle fill brightening on the peaks.
    const hot = clamp((beat1 + beat2) / 0.13, 0, 1);
    const r = 224 + 16 * hot;
    const g = 49 + 9 * hot;
    const b = 49 + 9 * hot;
    p1.setAttribute("fill", `#${hexRed(r)}${hexRed(g)}${hexRed(b)}`);

    // Highlight breathes with the heart.
    p2.setAttribute("stroke-width", (10 + hot * 1.2).toFixed(2));

    // Glint sweeps over the existing highlight after the heart settles.
    const g0 = 1.55;
    const g1 = 2.35;
    const gu = clamp((t - g0) / (g1 - g0), 0, 1);
    const fadeIn = smoothstep(0.00, 0.18, gu);
    const fadeOut = 1 - smoothstep(0.72, 1.00, gu);
    const gOpacity = fadeIn * fadeOut;

    glintGroup.setAttribute("opacity", (0.95 * gOpacity).toFixed(3));
    glint.setAttribute("stroke-dashoffset", (70 - 125 * gu).toFixed(2));
    glint.setAttribute("stroke-width", (5 + 2 * Math.sin(Math.PI * gu) * gOpacity).toFixed(2));

    // Tiny star pop at the end of the glint, invisible outside its moment.
    const su = clamp((t - 2.02) / 0.38, 0, 1);
    const sFade = smoothstep(0.00, 0.22, su) * (1 - smoothstep(0.58, 1.00, su));
    const starScale = 0.25 + 0.95 * Math.sin(Math.PI * clamp(su, 0, 1));
    const starRot = -18 + 72 * su;
    spark.setAttribute("opacity", (0.85 * sFade).toFixed(3));
    spark.setAttribute(
      "transform",
      `translate(224 173) rotate(${starRot.toFixed(2)}) scale(${starScale.toFixed(3)})`
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

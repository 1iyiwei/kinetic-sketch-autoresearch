<script>
(function () {
  const DURATION = 4.0;

  const fishAll = document.getElementById("fishAll");
  const bodyGroup = document.getElementById("bodyGroup");
  const tailGroup = document.getElementById("tailGroup");
  const bubble1Group = document.getElementById("bubble1Group");
  const bubble2Group = document.getElementById("bubble2Group");

  function clamp01(x) {
    return Math.max(0, Math.min(1, x));
  }

  window.ksaRender = function (t) {
    t = Math.max(0, Math.min(DURATION, t));
    const p = clamp01(t / DURATION);

    /*
      Anchor rule:
      At t = 0 every sinusoid is zero and every progress offset is zero,
      so all transforms are identity and the drawing matches the supplied SVG.
    */

    // The whole fish travels right-to-left with a gentle swimming bob.
    const swimX = -175 * p;
    const swimY = 6 * Math.sin(Math.PI * 3 * p);
    const wholeTilt = 1.4 * Math.sin(Math.PI * 6 * p);

    fishAll.setAttribute(
      "transform",
      "translate(" + swimX.toFixed(3) + " " + swimY.toFixed(3) + ") rotate(" + wholeTilt.toFixed(3) + " 255 256)"
    );

    // Slight body counter-roll gives the hand-drawn fish some buoyancy.
    const bodyRoll = 1.0 * Math.sin(Math.PI * 6 * p + 0.15) - 1.0 * Math.sin(0.15);
    bodyGroup.setAttribute(
      "transform",
      "rotate(" + bodyRoll.toFixed(3) + " 235 256)"
    );

    // Tail wags around the narrow base where it joins the body.
    // Phase chosen so t=0 is exactly neutral.
    const tailAngle = 16 * Math.sin(2 * Math.PI * 3.25 * t);
    const tailStretch = 1 + 0.035 * Math.abs(Math.sin(2 * Math.PI * 3.25 * t));
    tailGroup.setAttribute(
      "transform",
      "translate(316 256) rotate(" + tailAngle.toFixed(3) + ") scale(" + tailStretch.toFixed(4) + " 1) translate(-316 -256)"
    );

    // Bubbles drift upward, with tiny side-to-side wobble.
    const b1Y = -92 * p;
    const b1X = 7 * Math.sin(Math.PI * 2.5 * p);
    const b1Scale = 1 + 0.05 * Math.sin(Math.PI * 4 * p);
    bubble1Group.setAttribute(
      "transform",
      "translate(" + b1X.toFixed(3) + " " + b1Y.toFixed(3) + ") scale(" + b1Scale.toFixed(4) + ")"
    );

    const b2Y = -122 * p;
    const b2X = -6 * Math.sin(Math.PI * 3 * p);
    const b2Scale = 1 + 0.06 * Math.sin(Math.PI * 5 * p);
    bubble2Group.setAttribute(
      "transform",
      "translate(" + b2X.toFixed(3) + " " + b2Y.toFixed(3) + ") scale(" + b2Scale.toFixed(4) + ")"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

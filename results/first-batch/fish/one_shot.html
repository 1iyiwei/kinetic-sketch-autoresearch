<script>
(function () {
  const DURATION = 4.0;

  const fish = document.getElementById("fish");
  const body = document.getElementById("body");
  const tail = document.getElementById("tail");
  const s5 = document.getElementById("s5");
  const s6 = document.getElementById("s6");
  const wake = document.getElementById("wake");

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function easeInOutSine(x) {
    return -(Math.cos(Math.PI * x) - 1) / 2;
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);
    const p = t / DURATION;

    /*
      First frame anchor:
      all animated values are exactly 0 at t=0, so the original paths sit
      in their original positions with their original strokes and fills.
    */

    // Fish swims from right to left after starting at the supplied drawing.
    const travel = -230 * p;
    const bob = 5.5 * Math.sin(Math.PI * 2 * 1.25 * t);
    const bodyTilt = 2.2 * Math.sin(Math.PI * 2 * 1.25 * t);

    fish.setAttribute(
      "transform",
      "translate(" + travel.toFixed(3) + " " + bob.toFixed(3) + ")"
    );

    // Gentle body counter-motion, pivoting near the middle of the fish.
    body.setAttribute(
      "transform",
      "rotate(" + bodyTilt.toFixed(3) + " 230 256)"
    );

    // Tail wag, hinged where the tail meets the body.
    const wag = 15 * Math.sin(Math.PI * 2 * 3.0 * t);
    const tailSquash = 1 + 0.025 * Math.abs(Math.sin(Math.PI * 2 * 3.0 * t));
    tail.setAttribute(
      "transform",
      "rotate(" + wag.toFixed(3) + " 318 256) " +
      "translate(" + ((tailSquash - 1) * 10).toFixed(3) + " 0)"
    );

    // Bubbles drift upward with a light side-to-side wobble.
    // At t=0 these are identity transforms.
    const bubbleEase = easeInOutSine(p);
    const b5x = 12 * Math.sin(Math.PI * 2 * 0.75 * t);
    const b5y = -92 * bubbleEase;
    const b6x = 9 * Math.sin(Math.PI * 2 * 0.65 * t);
    const b6y = -125 * bubbleEase;

    s5.setAttribute(
      "transform",
      "translate(" + b5x.toFixed(3) + " " + b5y.toFixed(3) + ")"
    );
    s6.setAttribute(
      "transform",
      "translate(" + b6x.toFixed(3) + " " + b6y.toFixed(3) + ")"
    );

    // Keep bubbles visible at the anchor, then fade slightly as they rise.
    s5.setAttribute("opacity", (1 - 0.45 * p).toFixed(3));
    s6.setAttribute("opacity", (1 - 0.50 * p).toFixed(3));

    // Small wake lines appear only after the fish starts moving.
    const wakeOpacity = Math.max(0, Math.sin(Math.PI * p)) * 0.45;
    wake.setAttribute("opacity", wakeOpacity.toFixed(3));
    wake.setAttribute(
      "transform",
      "translate(" + (travel * 0.35).toFixed(3) + " " + (bob * 0.5).toFixed(3) + ")"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

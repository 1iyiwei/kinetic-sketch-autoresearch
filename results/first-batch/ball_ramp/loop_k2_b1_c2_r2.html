<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Rolling Ball Sketch Animation</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #ffffff;
  }
  svg {
    display: block;
    width: 512px;
    height: 512px;
  }
</style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Original ramp / floor path, unchanged -->
  <path id="s1" d="M39.5,150.5 L62.3,169.3 L84.6,188.4 L107.1,208.1 L128.8,226.6 L151.7,245.8 L174.3,264.4 L196.5,284.1 L218.3,304.1 L241.2,322.6 L262.8,342.0 L285.8,361.1 L307.6,380.3 L329.2,399.2 L340.8,399.4 L352.1,399.1 L363.5,399.2 L374.9,398.7 L387.2,399.0 L399.0,398.8 L411.3,399.5 L422.2,399.4 L434.1,399.8 L446.2,399.7 L458.1,400.0 L469.1,400.2 L481.0,400.6" fill="none" stroke="#1d1d1f" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Small added sketch motion marks; invisible at t=0 -->
  <g id="motionMarks" opacity="0" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path id="m1" d="M48,128 C40,126 35,121 31,116"/>
    <path id="m2" d="M56,105 C49,99 45,94 42,88"/>
    <path id="m3" d="M332,386 C324,384 318,381 313,376"/>
  </g>

  <!-- Original ball path, unchanged -->
  <path id="s2" d="M102.8,120.4 L102.9,123.1 L103.9,126.2 L103.4,129.5 L103.4,133.0 L102.4,136.0 L101.4,139.3 L99.9,141.9 L98.1,143.8 L95.3,146.5 L93.7,148.8 L90.9,150.0 L88.1,152.3 L85.5,153.3 L82.9,153.5 L79.5,154.5 L76.3,154.3 L72.7,153.8 L70.3,152.2 L67.6,151.5 L65.2,150.2 L62.8,148.3 L60.3,145.9 L57.4,143.9 L55.7,140.7 L54.2,137.7 L52.9,134.5 L52.4,131.6 L52.3,128.3 L51.7,124.8 L51.8,121.8 L53.5,119.3 L55.2,116.8 L56.4,114.4 L58.6,111.1 L60.1,108.1 L63.1,105.8 L65.3,104.5 L68.1,102.7 L70.8,102.0 L73.7,101.3 L77.4,101.2 L80.5,101.5 L83.1,102.1 L86.3,102.8 L88.8,104.9 L91.9,106.2 L94.7,108.8 L96.4,110.4 L98.1,113.4 L99.5,116.5 L101.4,119.5 L102.1,123.2 L103.3,126.2 L103.1,129.5 L102.8,132.6" fill="none" stroke="#1d1d1f" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const ball = document.getElementById("s2");
  const marks = document.getElementById("motionMarks");
  const m1 = document.getElementById("m1");
  const m2 = document.getElementById("m2");
  const m3 = document.getElementById("m3");

  // Approximate visual center of the original sketch ball.
  const cx0 = 77.5;
  const cy0 = 128.0;
  const r = 26.0;

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function easeInQuad(x) {
    x = clamp(x, 0, 1);
    return x * x;
  }

  function easeOutCubic(x) {
    x = clamp(x, 0, 1);
    return 1 - Math.pow(1 - x, 3);
  }

  function lerp(a, b, p) {
    return a + (b - a) * p;
  }

  function setMark(path, dx, dy, op) {
    path.setAttribute("transform", "translate(" + dx.toFixed(2) + " " + dy.toFixed(2) + ")");
    path.setAttribute("opacity", op.toFixed(3));
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    // At t=0 the drawing must be identical to the provided SVG.
    if (t === 0) {
      ball.removeAttribute("transform");
      ball.setAttribute("stroke-width", "4.0");
      marks.setAttribute("opacity", "0");
      m1.setAttribute("opacity", "0");
      m2.setAttribute("opacity", "0");
      m3.setAttribute("opacity", "0");
      return;
    }

    let cx = cx0;
    let cy = cy0;
    let distance = 0;
    let squashX = 1;
    let squashY = 1;

    // Phase 1: tiny cartoon anticipation and drop to meet the ramp.
    if (t < 0.50) {
      const p = t / 0.50;
      const settle = smoothstep(p);
      cx = lerp(cx0, 79.0, settle);
      cy = lerp(cy0, 149.0, settle);

      // A small bob, but zero at the first frame.
      cy += Math.sin(p * Math.PI) * -4.0;

      squashX = 1 + Math.sin(p * Math.PI) * 0.035;
      squashY = 1 - Math.sin(p * Math.PI) * 0.035;

      distance = Math.hypot(cx - cx0, cy - cy0) * 0.35;
    }

    // Phase 2: accelerates down the ramp.
    else if (t < 2.65) {
      const p = (t - 0.50) / 2.15;
      const e = easeInQuad(p);

      const sx = 79.0, sy = 149.0;
      const ex = 346.0, ey = 379.0;

      cx = lerp(sx, ex, e);
      cy = lerp(sy, ey, e);

      const rollDist = Math.hypot(cx - sx, cy - sy);
      distance = 8 + rollDist;

      // Speed lines pulse in as the ball gains speed.
      const op = Math.max(0, Math.sin(p * Math.PI) * 0.65);
      marks.setAttribute("opacity", op.toFixed(3));
      setMark(m1, lerp(0, 95, e), lerp(0, 84, e), op * 0.55);
      setMark(m2, lerp(0, 120, e), lerp(0, 104, e), op * 0.35);
      setMark(m3, lerp(-70, 0, e), lerp(-65, 0, e), op * 0.45);
    }

    // Phase 3: leaves the ramp, lands on the flat floor and bounces once.
    else if (t < 3.25) {
      const p = (t - 2.65) / 0.60;

      const sx = 346.0, sy = 379.0;
      const ex = 398.0, ey = 374.0;

      cx = lerp(sx, ex, easeOutCubic(p));

      // Small hop: up first, then down to floor centerline.
      const baseY = lerp(sy, ey, smoothstep(p));
      const hop = -18 * Math.sin(Math.PI * p);
      cy = baseY + hop;

      const rollDistRamp = Math.hypot(346 - 79, 379 - 149);
      const rollDistFlat = Math.max(0, cx - 346);
      distance = 8 + rollDistRamp + rollDistFlat;

      // Squash at contact near the end of the hop.
      const impact = Math.exp(-Math.pow((p - 0.88) / 0.13, 2));
      squashX = 1 + 0.12 * impact;
      squashY = 1 - 0.12 * impact;

      const op = Math.max(0, 1 - p) * 0.45;
      marks.setAttribute("opacity", op.toFixed(3));
      setMark(m1, 170, 145, op * 0.20);
      setMark(m2, 185, 160, op * 0.18);
      setMark(m3, 0, 0, op);
    }

    // Phase 4: rolls along the floor, slows, tiny settling bounce.
    else {
      const p = (t - 3.25) / 0.75;
      const e = easeOutCubic(p);

      cx = lerp(398.0, 455.0, e);
      cy = 374.0;

      // Damped little bounce after landing.
      const bounce = Math.sin(p * Math.PI * 3.0) * Math.exp(-p * 4.2);
      cy += -5.5 * Math.max(0, bounce);

      const settleSquash = Math.abs(bounce) * Math.exp(-p * 3.2);
      squashX = 1 + 0.035 * settleSquash;
      squashY = 1 - 0.035 * settleSquash;

      const rollDistRamp = Math.hypot(346 - 79, 379 - 149);
      const rollDistFlat = 52 + Math.max(0, cx - 398);
      distance = 8 + rollDistRamp + rollDistFlat;

      const op = Math.max(0, 1 - p) * 0.25;
      marks.setAttribute("opacity", op.toFixed(3));
      setMark(m1, 240, 225, 0);
      setMark(m2, 240, 225, 0);
      setMark(m3, 58, -1, op);
    }

    // Rolling rotation: clockwise in screen coordinates.
    const angle = (distance / r) * 180 / Math.PI;

    const dx = cx - cx0;
    const dy = cy - cy0;

    const transform =
      "translate(" + dx.toFixed(3) + " " + dy.toFixed(3) + ") " +
      "rotate(" + angle.toFixed(3) + " " + cx0 + " " + cy0 + ") " +
      "translate(" + cx0 + " " + cy0 + ") " +
      "scale(" + squashX.toFixed(4) + " " + squashY.toFixed(4) + ") " +
      "translate(" + (-cx0) + " " + (-cy0) + ")";

    ball.setAttribute("transform", transform);
    ball.setAttribute("stroke-width", "4.0");
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

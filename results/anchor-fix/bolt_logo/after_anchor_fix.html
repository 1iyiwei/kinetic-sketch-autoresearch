<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cloud Lightning Logo Animation - Revised</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #ffffff;
    }
    svg {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="boltClip">
      <rect id="boltClipRect" x="0" y="0" width="512" height="512" />
    </clipPath>
    <clipPath id="streakClip">
      <rect id="streakClipRect" x="0" y="0" width="512" height="0" />
    </clipPath>
  </defs>

  <rect id="bg" width="512" height="512" fill="#f1f3f5"/>

  <!-- Added effect elements. They are invisible at the final anchor frame. -->
  <circle id="flashCore" cx="256" cy="250" r="1" fill="#fff9db" opacity="0"/>
  <circle id="flashRing" cx="256" cy="250" r="1" fill="none" stroke="#fff3bf" stroke-width="8" opacity="0"/>

  <g id="impactLines" opacity="0" fill="none" stroke="#fcc419" stroke-width="5" stroke-linecap="round">
    <path d="M203 248 L168 232"/>
    <path d="M304 244 L346 220"/>
    <path d="M222 318 L185 333"/>
    <path d="M292 310 L334 330"/>
    <path d="M256 226 L256 190"/>
  </g>

  <!-- Fast downward pre-strike streak, clipped top-to-bottom. -->
  <g id="streakGroup" clip-path="url(#streakClip)" opacity="0">
    <path id="strikeStreak" d="M272 135 L248 242 L270 242 L222 438"
          fill="none" stroke="#fcc419" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g id="cloudGroup">
    <path id="p1" d="M150 250 C 120 250, 110 200, 150 190 C 150 140, 220 130, 240 170 C 270 130, 350 150, 340 200 C 390 200, 390 250, 350 250 Z" fill="#868e96"/>
  </g>

  <g id="boltGroup" clip-path="url(#boltClip)">
    <polygon id="p2" points="250,240 200,350 245,350 220,440 310,320 262,320 290,240" fill="#fcc419"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const bg = document.getElementById("bg");
  const cloudGroup = document.getElementById("cloudGroup");
  const boltGroup = document.getElementById("boltGroup");
  const boltClipRect = document.getElementById("boltClipRect");
  const streakGroup = document.getElementById("streakGroup");
  const streakClipRect = document.getElementById("streakClipRect");
  const flashCore = document.getElementById("flashCore");
  const flashRing = document.getElementById("flashRing");
  const impactLines = document.getElementById("impactLines");

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function mix(a, b, u) {
    return a + (b - a) * u;
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function easeOutCubic(x) {
    x = clamp(x, 0, 1);
    return 1 - Math.pow(1 - x, 3);
  }

  function easeInCubic(x) {
    x = clamp(x, 0, 1);
    return x * x * x;
  }

  function easeOutBack(x) {
    x = clamp(x, 0, 1);
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function pulse(t, center, width) {
    return clamp(1 - Math.abs(t - center) / width, 0, 1);
  }

  function hex2(n) {
    n = Math.round(clamp(n, 0, 255));
    return n.toString(16).padStart(2, "0");
  }

  function blendHex(base, target, u) {
    const br = parseInt(base.slice(1, 3), 16);
    const bg = parseInt(base.slice(3, 5), 16);
    const bb = parseInt(base.slice(5, 7), 16);
    const tr = parseInt(target.slice(1, 3), 16);
    const tg = parseInt(target.slice(3, 5), 16);
    const tb = parseInt(target.slice(5, 7), 16);
    return "#" + hex2(mix(br, tr, u)) + hex2(mix(bg, tg, u)) + hex2(mix(bb, tb, u));
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    /*
      Final anchor: at t = 4.0 the original rect/path/polygon are exactly as supplied:
      no visible added effects, no transforms, original fills, and a full bolt clip.
    */
    if (t >= DURATION) {
      bg.setAttribute("fill", "#f1f3f5");

      cloudGroup.setAttribute("transform", "");
      cloudGroup.setAttribute("opacity", "1");

      boltGroup.setAttribute("transform", "");
      boltGroup.setAttribute("opacity", "1");

      boltClipRect.setAttribute("x", "0");
      boltClipRect.setAttribute("y", "0");
      boltClipRect.setAttribute("width", "512");
      boltClipRect.setAttribute("height", "512");

      streakGroup.setAttribute("opacity", "0");
      streakClipRect.setAttribute("x", "0");
      streakClipRect.setAttribute("y", "0");
      streakClipRect.setAttribute("width", "512");
      streakClipRect.setAttribute("height", "0");

      flashCore.setAttribute("opacity", "0");
      flashRing.setAttribute("opacity", "0");
      impactLines.setAttribute("opacity", "0");
      return;
    }

    // ------------------------------------------------------------------
    // CLOUD: a clearer left-to-right logo drift, beginning mostly offscreen.
    // ------------------------------------------------------------------
    const cloudU = easeOutBack((t - 0.02) / 0.78);
    let cloudX = -240 * (1 - cloudU);
    let cloudY = 28 * (1 - cloudU) + Math.sin(cloudU * Math.PI) * -8;
    let cloudOpacity = smoothstep((t - 0.00) / 0.36);

    // Anticipation just before the strike: the cloud lifts a hair.
    const anticipation = pulse(t, 1.34, 0.22);
    cloudY -= 5 * anticipation;

    // Impact recoil and settle, strong enough to read in the 2.25s overview frame.
    if (t >= 1.62) {
      const u = t - 1.62;
      const decay = Math.exp(-2.0 * u);
      cloudY += Math.sin(u * 16.5 + 0.35) * 10.5 * decay;
      cloudX += Math.sin(u * 12.0 + 1.2) * 3.2 * decay;
    }

    const cloudSquash = pulse(t, 1.70, 0.24);
    let cloudSX = 1 + 0.050 * cloudSquash;
    let cloudSY = 1 - 0.070 * cloudSquash;

    // Follow-through after the hit.
    if (t > 1.86) {
      const u = t - 1.86;
      const decay = Math.exp(-2.6 * u);
      cloudSX += Math.sin(u * 13.5) * 0.030 * decay;
      cloudSY -= Math.sin(u * 13.5) * 0.026 * decay;
    }

    cloudGroup.setAttribute(
      "transform",
      "translate(256 222) translate(" + cloudX.toFixed(3) + " " + cloudY.toFixed(3) + ") " +
      "scale(" + cloudSX.toFixed(4) + " " + cloudSY.toFixed(4) + ") translate(-256 -222)"
    );
    cloudGroup.setAttribute("opacity", cloudOpacity.toFixed(3));

    // ------------------------------------------------------------------
    // LIGHTNING: visible top-to-bottom strike, then snap into final shape.
    // ------------------------------------------------------------------
    // Streak starts above the cloud at about 1.08s and grows down over a few frames.
    const streakU = smoothstep((t - 1.06) / 0.42);
    const streakFadeOut = 1 - smoothstep((t - 1.62) / 0.18);
    const streakOpacity = streakU * streakFadeOut;
    const streakTop = 110;
    const streakBottom = mix(110, 455, streakU);

    streakClipRect.setAttribute("x", "0");
    streakClipRect.setAttribute("y", String(streakTop));
    streakClipRect.setAttribute("width", "512");
    streakClipRect.setAttribute("height", String(Math.max(0, streakBottom - streakTop)));
    streakGroup.setAttribute("opacity", streakOpacity.toFixed(3));

    // The real polygon is revealed from top to bottom, so it reads as the bolt striking downward.
    const reveal = smoothstep((t - 1.20) / 0.52);
    const clipY = 232;
    const clipH = 230 * reveal;
    boltClipRect.setAttribute("x", "160");
    boltClipRect.setAttribute("y", String(clipY));
    boltClipRect.setAttribute("width", "190");
    boltClipRect.setAttribute("height", String(clipH));

    let boltOpacity = smoothstep((t - 1.12) / 0.22);

    // Downward overshoot at impact, then decaying rebound.
    let boltY = -28 * (1 - easeOutCubic((t - 1.20) / 0.55));
    if (t >= 1.64) {
      const u = t - 1.64;
      boltY += Math.sin(u * 20.0 + 0.9) * 13.5 * Math.exp(-2.9 * u);
    }

    const boltImpact = pulse(t, 1.68, 0.18);
    let boltSX = 1 + 0.055 * boltImpact;
    let boltSY = 1 - 0.050 * boltImpact;

    if (t > 1.84) {
      const u = t - 1.84;
      const decay = Math.exp(-3.0 * u);
      boltSX += Math.sin(u * 19) * 0.025 * decay;
      boltSY -= Math.sin(u * 19) * 0.020 * decay;
    }

    boltGroup.setAttribute(
      "transform",
      "translate(255 240) translate(0 " + boltY.toFixed(3) + ") " +
      "scale(" + boltSX.toFixed(4) + " " + boltSY.toFixed(4) + ") translate(-255 -240)"
    );
    boltGroup.setAttribute("opacity", boltOpacity.toFixed(3));

    // ------------------------------------------------------------------
    // FLASH: bright, brief, and visible at the strike moment/sample.
    // ------------------------------------------------------------------
    const flashA = Math.max(
      pulse(t, 1.62, 0.11) * 0.75,
      pulse(t, 1.73, 0.20) * 0.42
    );

    bg.setAttribute("fill", blendHex("#f1f3f5", "#fff9db", flashA * 0.95));

    flashCore.setAttribute("r", (35 + 180 * flashA).toFixed(2));
    flashCore.setAttribute("opacity", (0.55 * flashA).toFixed(3));

    flashRing.setAttribute("r", (20 + 150 * flashA).toFixed(2));
    flashRing.setAttribute("stroke-width", (4 + 12 * flashA).toFixed(2));
    flashRing.setAttribute("opacity", (0.70 * flashA).toFixed(3));

    const lineA = Math.max(pulse(t, 1.66, 0.18), pulse(t, 1.78, 0.20) * 0.45);
    const lineScale = 0.86 + 0.24 * lineA;
    impactLines.setAttribute("opacity", (0.75 * lineA).toFixed(3));
    impactLines.setAttribute(
      "transform",
      "translate(256 256) scale(" + lineScale.toFixed(3) + " " + lineScale.toFixed(3) + ") translate(-256 -256)"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

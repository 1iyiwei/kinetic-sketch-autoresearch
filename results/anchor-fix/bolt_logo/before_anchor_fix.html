<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Revised Cloud Lightning Logo Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f1f3f5;
    }
    svg {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="boltClip">
      <rect id="boltClipRect" x="0" y="0" width="512" height="512"/>
    </clipPath>

    <filter id="boltGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect id="bg" width="512" height="512" fill="#f1f3f5"/>

  <!-- one-frame-ish lightning flash wash -->
  <rect id="flashWash" width="512" height="512" fill="#fff9db" opacity="0"/>

  <!-- entrance wind streaks, hidden at t=0 -->
  <g id="cloudStreaks" opacity="0" fill="none" stroke="#adb5bd" stroke-width="5" stroke-linecap="round">
    <path d="M76 184 C100 176, 122 176, 145 183"/>
    <path d="M58 213 C88 205, 112 206, 140 214"/>
    <path d="M78 241 C103 234, 124 235, 148 242"/>
  </g>

  <!-- bright origin/impact rays, hidden at t=0 -->
  <g id="flashRays" opacity="0" fill="none" stroke="#fff3bf" stroke-width="8" stroke-linecap="round">
    <path d="M256 236 L256 166"/>
    <path d="M285 250 L356 214"/>
    <path d="M226 250 L156 214"/>
    <path d="M292 323 L365 365"/>
    <path d="M218 323 L145 365"/>
    <path d="M246 438 L226 486"/>
    <path d="M267 438 L293 486"/>
  </g>

  <!-- tiny contact spark, hidden at t=0 -->
  <g id="spark" opacity="0" fill="none" stroke="#ffd43b" stroke-width="6" stroke-linecap="round">
    <path d="M218 432 L190 458"/>
    <path d="M225 439 L218 475"/>
    <path d="M237 432 L269 459"/>
  </g>

  <!-- original artwork paths are reused verbatim -->
  <g id="cloudGroup">
    <path id="p1" d="M150 250 C 120 250, 110 200, 150 190 C 150 140, 220 130, 240 170 C 270 130, 350 150, 340 200 C 390 200, 390 250, 350 250 Z" fill="#868e96"/>
  </g>

  <g id="boltGroup" clip-path="url(#boltClip)">
    <polygon id="p2" points="250,240 200,350 245,350 220,440 310,320 262,320 290,240" fill="#fcc419"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const cloudGroup = document.getElementById("cloudGroup");
  const boltGroup = document.getElementById("boltGroup");
  const boltClipRect = document.getElementById("boltClipRect");
  const p2 = document.getElementById("p2");
  const flashWash = document.getElementById("flashWash");
  const flashRays = document.getElementById("flashRays");
  const cloudStreaks = document.getElementById("cloudStreaks");
  const spark = document.getElementById("spark");

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function norm(t, a, b) {
    return clamp((t - a) / (b - a), 0, 1);
  }

  function easeInCubic(x) {
    return x * x * x;
  }

  function easeOutCubic(x) {
    return 1 - Math.pow(1 - x, 3);
  }

  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  function easeOutBack(x) {
    const c1 = 1.45;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function pulse(t, c, hw) {
    return clamp(1 - Math.abs(t - c) / hw, 0, 1);
  }

  function setIdentityFrame() {
    cloudGroup.setAttribute("transform", "");
    boltGroup.setAttribute("transform", "");
    boltGroup.setAttribute("opacity", "1");
    p2.setAttribute("fill", "#fcc419");
    p2.setAttribute("opacity", "1");
    p2.removeAttribute("filter");

    boltClipRect.setAttribute("x", "0");
    boltClipRect.setAttribute("y", "0");
    boltClipRect.setAttribute("width", "512");
    boltClipRect.setAttribute("height", "512");

    flashWash.setAttribute("opacity", "0");
    flashRays.setAttribute("opacity", "0");
    flashRays.setAttribute("transform", "");
    cloudStreaks.setAttribute("opacity", "0");
    cloudStreaks.setAttribute("transform", "");
    spark.setAttribute("opacity", "0");
    spark.setAttribute("transform", "");
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    /*
      t=0 is exactly the supplied logo drawing.
      After that, the animation treats the cloud as the entering element,
      hides the bolt until the strike, then draws the bolt downward from
      its cloud attachment point and settles the whole logo.
    */
    if (t === 0) {
      setIdentityFrame();
      return;
    }

    // --------------------------
    // Cloud entrance and settling
    // --------------------------
    let x = 0, y = 0, rot = 0, sx = 1, sy = 1;

    if (t < 0.92) {
      // Clean one-direction drift-in from the left with a small overshoot.
      const k = easeOutBack(norm(t, 0.02, 0.92));
      x = -190 * (1 - k);
      y = -18 * (1 - k) + Math.sin(k * Math.PI) * -5;
      rot = -3.0 * (1 - k) + Math.sin(k * Math.PI) * 1.0;
      sx = 1 + 0.018 * Math.sin(k * Math.PI);
      sy = 1 - 0.012 * Math.sin(k * Math.PI);
    } else if (t < 1.10) {
      // Gentle arrival cushion before the lightning.
      const k = norm(t, 0.92, 1.10);
      x = Math.sin(k * Math.PI) * 4;
      y = Math.sin(k * Math.PI) * 2;
      rot = Math.sin(k * Math.PI) * -0.7;
    } else if (t < 1.75) {
      // Strike recoil: cloud squashes, lifts, then rebounds.
      const hit = pulse(t, 1.24, 0.18);
      const s = Math.max(0, t - 1.24);
      const decay = Math.exp(-4.0 * s);
      x = Math.sin(s * 18) * 5.5 * decay;
      y = -7 * hit + Math.cos(s * 16) * 4.5 * decay;
      rot = Math.sin(s * 15) * 1.7 * decay;
      sx = 1 + 0.045 * hit + Math.sin(s * 18) * 0.015 * decay;
      sy = 1 - 0.035 * hit - Math.sin(s * 18) * 0.012 * decay;
    } else {
      // Long tail settle to the final centered logo.
      const s = t - 1.75;
      const decay = Math.exp(-2.8 * s);
      x = Math.sin(s * 10) * 2.2 * decay;
      y = Math.cos(s * 9) * 1.4 * decay;
      rot = Math.sin(s * 8.5) * 0.6 * decay;
      sx = 1 + Math.sin(s * 10) * 0.006 * decay;
      sy = 1 - Math.sin(s * 10) * 0.005 * decay;
    }

    const cloudTransform =
      `translate(245 205) translate(${x.toFixed(3)} ${y.toFixed(3)}) ` +
      `rotate(${rot.toFixed(3)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(-245 -205)`;
    cloudGroup.setAttribute("transform", cloudTransform);

    // Entrance streaks only trail behind the cloud while it enters.
    const streakA = 0.65 * norm(t, 0.10, 0.25) * (1 - norm(t, 0.62, 0.95));
    cloudStreaks.setAttribute("opacity", streakA.toFixed(3));
    cloudStreaks.setAttribute(
      "transform",
      `translate(${(x - 10 - 18 * norm(t, 0.10, 0.80)).toFixed(3)} ${(y * 0.25).toFixed(3)})`
    );

    // --------------------------
    // Lightning strike
    // --------------------------
    let boltOpacity = 1;
    let clipY = 0, clipH = 512;
    let bx = x, by = y, brot = rot, bsx = 1, bsy = 1;
    let boltFill = "#fcc419";
    let boltFilter = false;

    if (t < 1.05) {
      // Bolt is hidden during cloud drift so it cannot detach or slide.
      boltOpacity = 0;
      clipY = 240;
      clipH = 0;
    } else if (t < 1.15) {
      // Small anticipation: a short yellow tongue tucked under the cloud.
      const k = norm(t, 1.05, 1.15);
      boltOpacity = 1;
      clipY = 240;
      clipH = 35 * easeInOutCubic(k);
      bsx = 0.75;
      bsy = 0.65;
      by = y - 4 * k;
    } else if (t < 1.32) {
      // Main strike: reveal downward from fixed cloud attachment point.
      const k = easeOutCubic(norm(t, 1.15, 1.32));
      boltOpacity = 1;
      clipY = 240;
      clipH = 210 * k;
      bx = x + Math.sin(k * Math.PI * 5) * (1 - k) * 4;
      by = y;
      brot = rot + Math.sin(k * Math.PI) * -1.5;
      bsx = 0.82 + 0.18 * k;
      bsy = 1.20 - 0.20 * k;
      boltFill = k > 0.45 && k < 0.85 ? "#fff3bf" : "#fcc419";
      boltFilter = true;
    } else {
      // Keep final bolt visible and attached; damped recoil around top attachment.
      const s = t - 1.32;
      const decay = Math.exp(-3.4 * s);
      boltOpacity = 1;
      clipY = 0;
      clipH = 512;
      bx = x + Math.sin(s * 18) * 5.0 * decay;
      by = y + Math.cos(s * 15) * 3.0 * decay;
      brot = rot + Math.sin(s * 16) * 4.2 * decay;
      bsx = 1 + Math.sin(s * 17) * 0.025 * decay;
      bsy = 1 - Math.sin(s * 17) * 0.020 * decay;
    }

    boltGroup.setAttribute("opacity", boltOpacity.toFixed(3));
    boltClipRect.setAttribute("x", "0");
    boltClipRect.setAttribute("y", clipY.toFixed(3));
    boltClipRect.setAttribute("width", "512");
    boltClipRect.setAttribute("height", clipH.toFixed(3));

    // Pivot near the top of the bolt, where it attaches to the cloud.
    boltGroup.setAttribute(
      "transform",
      `translate(270 240) translate(${bx.toFixed(3)} ${by.toFixed(3)}) ` +
      `rotate(${brot.toFixed(3)}) scale(${bsx.toFixed(4)} ${bsy.toFixed(4)}) translate(-270 -240)`
    );

    p2.setAttribute("fill", boltFill);
    p2.setAttribute("opacity", "1");
    if (boltFilter) {
      p2.setAttribute("filter", "url(#boltGlow)");
    } else {
      p2.removeAttribute("filter");
    }

    // --------------------------
    // Flash, rays, spark
    // --------------------------
    const washA = Math.max(
      0.72 * pulse(t, 1.24, 0.055),
      0.28 * pulse(t, 1.32, 0.10)
    );
    flashWash.setAttribute("opacity", washA.toFixed(3));

    const rayA = Math.max(
      pulse(t, 1.24, 0.10),
      0.45 * pulse(t, 1.34, 0.13)
    );
    const rayScale = 0.68 + 0.55 * easeOutCubic(norm(t, 1.17, 1.36));
    flashRays.setAttribute("opacity", (0.95 * rayA).toFixed(3));
    flashRays.setAttribute(
      "transform",
      `translate(256 300) scale(${rayScale.toFixed(3)}) translate(-256 -300)`
    );

    const sparkA = pulse(t, 1.32, 0.20);
    const sparkScale = 0.65 + 0.55 * easeOutCubic(norm(t, 1.26, 1.48));
    spark.setAttribute("opacity", (0.95 * sparkA).toFixed(3));
    spark.setAttribute(
      "transform",
      `translate(225 440) scale(${sparkScale.toFixed(3)}) translate(-225 -440)`
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logo Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
            /* Ensure the canvas is visible and sized correctly */
            width: 512px;
            height: 512px;
        }
    </style>
</head>
<body>
    <canvas id="stage" width="512" height="512"></canvas>

    <script>
        // SVG Data definition
        const svgData = {
            p1: {
                color: "#1c7ed6",
                points: "96,200.0 104,204.1 112,208.0 120,211.8 128,215.3 136,218.4 144,221.0 152,223.2 160,224.7 168,225.7 176,226.0 184,225.7 192,224.7 200,223.2 208,221.0 216,218.4 224,215.3 232,211.8 240,208.0 248,204.1 256,200.0 264,195.9 272,192.0 280,188.2 288,184.7 296,181.6 304,179.0 312,176.8 320,175.3 328,174.3 336,174.0 344,174.3 352,175.3 360,176.8 368,179.0 376,181.6 384,184.7 392,188.2 400,192.0 408,195.9 416,200.0"
            },
            p2: {
                color: "#339af0",
                points: "96,256.0 104,260.1 112,264.0 120,267.8 128,271.3 136,274.4 144,277.0 152,279.2 160,280.7 168,281.7 176,282.0 184,281.7 192,280.7 200,279.2 208,277.0 216,274.4 224,271.3 232,267.8 240,264.0 248,260.1 256,256.0 264,251.9 272,248.0 280,244.2 288,240.7 296,237.6 304,235.0 312,232.8 320,231.3 328,230.3 336,230.0 344,230.3 352,231.3 360,232.8 368,235.0 376,237.6 384,240.7 392,244.2 400,248.0 408,251.9 416,256.0"
            },
            p3: {
                color: "#74c0fc",
                points: "96,312.0 104,316.1 112,320.0 120,323.8 128,327.3 136,330.4 144,333.0 152,335.2 160,336.7 168,337.7 176,338.0 184,337.7 192,336.7 200,335.2 208,333.0 216,330.4 224,327.3 232,323.8 240,320.0 248,316.1 256,312.0 264,307.9 272,304.0 280,300.2 288,296.7 296,293.6 304,291.0 312,288.8 320,287.3 328,286.3 336,286.0 344,286.3 352,287.3 360,288.8 368,291.0 376,293.6 384,296.7 392,300.2 400,304.0 408,307.9 416,312.0"
            }
        };

        // Helper to parse points into coordinate arrays
        function parsePoints(str) {
            return str.split(' ').map(pair => {
                const [x, y] = pair.split(',').map(Number);
                return { x, y };
            });
        }

        // Store for pre-calculated geometry
        const geometry = {};
        for (const key in svgData) {
            geometry[key] = parsePoints(svgData[key].points);
        }

        // Helper: Easing functions
        function easeOutBack(x) {
            const c1 = 1.70158;
            const c3 = c1 + 1;
            return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        }

        function easeOutCubic(x) {
            return 1 - Math.pow(1 - x, 3);
        }

        // Helper: Draw a polyline with a clip (draw-on effect)
        function drawPolyline(ctx, points, color, offsetX, offsetY, clipX, clipY) {
            if (points.length < 2) return;

            ctx.save();
            
            // Apply transform (bounce offset)
            ctx.translate(offsetX, offsetY);

            // Apply clip (draw-on effect)
            ctx.beginPath();
            ctx.rect(0, 0, clipX, clipY);
            ctx.clip();

            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }
            
            ctx.strokeStyle = color;
            ctx.lineWidth = 22;
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.stroke();
            
            ctx.restore();
        }

        // Main Render Function
        window.ksaRender = (t) => {
            const canvas = document.getElementById('stage');
            const ctx = canvas.getContext('2d');

            // Clear canvas
            ctx.clearRect(0, 0, 512, 512);

            // Animation Parameters
            const totalDuration = 4.0;
            
            // Phase 1: Draw on (0.0s to 1.2s)
            // Wave 1 starts at 0.0s
            // Wave 2 starts at 0.2s
            // Wave 3 starts at 0.4s
            // Each drawing takes 0.3s
            const drawStart1 = 0.0;
            const drawStart2 = 0.2;
            const drawStart3 = 0.4;
            const drawDuration = 0.4; // generous duration for 40 points

            // Phase 2: Ripple (1.2s to 2.0s)
            // A gentle sine wave oscillation
            const rippleStart = 1.2;
            const rippleDuration = 0.8;
            const rippleAmp = 4;
            
            // Phase 3: Settle (2.0s to 4.0s)
            // Static

            // --- Calculate Offsets ---

            // Wave 1
            let off1X = 0, off1Y = 0;
            if (t < drawStart1) {
                off1X = -100; // Start off-screen left
            } else if (t < drawStart1 + drawDuration) {
                const progress = (t - drawStart1) / drawDuration;
                // Ease out cubic for smooth drawing
                off1X = -100 + (600 * easeOutCubic(progress)); 
            } else {
                // Ripple
                if (t >= rippleStart && t < rippleStart + rippleDuration) {
                    const rippleProgress = (t - rippleStart) / rippleDuration;
                    // One full cycle of ripple
                    const ripple = Math.sin(rippleProgress * Math.PI * 2) * rippleAmp;
                    off1Y = ripple;
                }
            }

            // Wave 2
            let off2X = 0, off2Y = 0;
            if (t < drawStart2) {
                off2X = -100;
            } else if (t < drawStart2 + drawDuration) {
                const progress = (t - drawStart2) / drawDuration;
                off2X = -100 + (600 * easeOutCubic(progress));
            } else {
                if (t >= rippleStart && t < rippleStart + rippleDuration) {
                    const rippleProgress = (t - rippleStart) / rippleDuration;
                    const ripple = Math.sin(rippleProgress * Math.PI * 2) * rippleAmp;
                    off2Y = ripple;
                }
            }

            // Wave 3
            let off3X = 0, off3Y = 0;
            if (t < drawStart3) {
                off3X = -100;
            } else if (t < drawStart3 + drawDuration) {
                const progress = (t - drawStart3) / drawDuration;
                off3X = -100 + (600 * easeOutCubic(progress));
            } else {
                if (t >= rippleStart && t < rippleStart + rippleDuration) {
                    const rippleProgress = (t - rippleStart) / rippleDuration;
                    const ripple = Math.sin(rippleProgress * Math.PI * 2) * rippleAmp;
                    off3Y = ripple;
                }
            }

            // --- Draw ---

            // Draw Wave 1
            const clipW1 = t < drawStart1 + drawDuration ? (t - drawStart1) / drawDuration * 512 + 100 : 512;
            drawPolyline(ctx, geometry.p1, svgData.p1.color, off1X, off1Y, clipW1, 512);

            // Draw Wave 2
            const clipW2 = t < drawStart2 + drawDuration ? (t - drawStart2) / drawDuration * 512 + 100 : 512;
            drawPolyline(ctx, geometry.p2, svgData.p2.color, off2X, off2Y, clipW2, 512);

            // Draw Wave 3
            const clipW3 = t < drawStart3 + drawDuration ? (t - drawStart3) / drawDuration * 512 + 100 : 512;
            drawPolyline(ctx, geometry.p3, svgData.p3.color, off3X, off3Y, clipW3, 512);
        };
    </script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

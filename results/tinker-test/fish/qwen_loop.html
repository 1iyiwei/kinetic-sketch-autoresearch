<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Animation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            background-color: #ffffff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 512px;
            height: auto;
        }
    </style>
</head>
<body>
    <canvas id="stage" width="512" height="512"></canvas>

    <script>
        // Store the static path data from the SVG source to reuse verbatim.
        const PATHS = {
            body: "M125.2,225.5 L130.3,220.4 L135.5,216.3 L142.1,212.5 L149.3,209.1 L156.8,206.1 L165.6,202.8 L174.4,200.4 L183.0,198.3 L192.9,196.2 L202.9,195.3 L213.0,194.3 L222.0,194.6 L232.2,194.7 L241.2,195.0 L250.9,196.1 L260.7,198.1 L269.1,200.5 L277.4,203.8 L286.1,206.8 L293.8,210.4 L301.1,214.8 L306.6,218.5 L312.4,222.6 L317.4,226.6 L322.1,231.7 L324.8,237.1 L327.1,242.0 L328.8,246.9 L329.3,253.1 L329.7,257.9 L329.3,262.9 L327.3,269.2 L324.9,274.3 L321.3,279.4 L316.6,285.2 L311.1,289.8 L306.0,294.2 L300.4,298.0 L294.1,302.5 L286.6,306.5 L278.2,309.9 L270.0,312.4 L260.8,314.7 L251.3,315.7 L242.1,316.6 L232.3,317.9 L221.9,317.5 L211.6,317.6 L201.9,316.7 L192.4,316.3 L182.8,314.5 L174.4,312.6 L165.4,310.1 L157.2,306.6 L149.3,303.1 L142.6,299.3 L136.2,296.1 L130.8,291.5 L125.6,286.6",
            tail: "M315.9,228.0 L322.8,225.7 L328.9,221.9 L335.3,218.4 L341.1,216.1 L347.1,213.5 L353.6,211.2 L360.8,207.5 L366.9,205.2 L373.7,202.1 L380.7,199.5 L387.1,196.4 L393.0,193.2 L399.0,190.4 L398.2,194.9 L397.2,199.4 L395.5,204.8 L394.4,210.6 L393.5,215.9 L391.8,221.3 L390.1,226.4 L389.7,231.9 L389.2,236.7 L388.2,242.0 L386.3,247.4 L385.7,252.1 L384.8,256.9 L385.5,262.1 L386.1,267.4 L388.1,271.9 L389.9,276.3 L391.4,281.0 L393.1,286.1 L394.6,290.6 L394.8,296.3 L396.0,301.5 L396.4,306.1 L397.4,310.7 L399.4,316.4 L401.2,321.9 L394.2,318.4 L388.0,315.0 L381.4,312.3 L374.8,308.9 L367.6,306.3 L360.5,303.6 L353.6,300.6 L346.9,297.9 L340.6,294.7 L334.0,292.1 L328.4,289.2 L321.5,286.1 L314.9,283.5",
            eye: "M169.0,235.4 L168.8,239.2 L167.2,242.8 L164.1,246.3 L160.5,247.6 L156.9,247.1 L154.0,244.5 L152.1,241.7 L151.2,237.6 L152.4,233.1 L154.7,230.7 L158.2,229.7 L161.8,230.0 L164.7,232.2 L167.5,235.2 L168.1,239.9",
            fin: "M269.7,216.1 L273.8,219.4 L276.7,222.8 L279.3,225.7 L282.9,229.1 L285.8,233.9 L287.8,238.9 L289.3,243.3 L290.0,247.9 L290.9,253.4 L291.1,258.1 L290.5,262.9 L289.8,268.3 L288.8,273.4 L286.8,278.4 L283.6,282.7 L280.1,286.4 L276.5,290.7 L272.5,294.3 L269.7,296.8",
            b1: "M140.5,329.4 L139.0,332.8 L136.0,335.7 L133.0,337.6 L129.0,338.1 L124.5,337.0 L121.1,335.3 L119.4,331.7 L119.6,327.8 L121.4,323.7 L124.1,321.6 L127.8,320.2 L132.6,320.7 L136.9,323.2 L139.4,325.9 L140.3,329.9",
            b2: "M117.5,370.0 L116.9,373.7 L114.5,376.6 L111.8,377.2 L108.9,377.2 L106.4,375.0 L104.1,371.4 L103.8,368.6 L105.0,364.9 L107.4,362.5 L111.0,362.7 L114.7,363.3 L116.6,365.5 L117.9,369.5"
        };

        const CANVAS_WIDTH = 512;
        const CANVAS_HEIGHT = 512;
        const DURATION = 4.0;

        // Pre-parse paths for performance
        const paths = {
            body: parsePath(PATHS.body),
            tail: parsePath(PATHS.tail),
            eye: parsePath(PATHS.eye),
            fin: parsePath(PATHS.fin),
            b1: parsePath(PATHS.b1),
            b2: parsePath(PATHS.b2)
        };

        /**
         * Parses an SVG path string into an array of {x, y} points.
         */
        function parsePath(d) {
            const s = d.split(' ').map(c => c.replace(/[A-Z]/g, '')).join(' ');
            const nums = s.match(/-?\d+(\.\d+)?/g).map(Number);
            const pts = [];
            for (let i = 0; i < nums.length; i += 2) {
                pts.push({ x: nums[i], y: nums[i+1] });
            }
            return pts;
        }

        /**
         * Linear Interpolation
         */
        function lerp(start, end, t) {
            return start * (1 - t) + end * t;
        }

        /**
         * Draws a path defined by points onto the canvas context.
         * @param {CanvasRenderingContext2D} ctx
         * @param {Array} points
         * @param {Object} transform - { tx, ty, rotation (rad), scale }
         */
        function drawPath(ctx, points, transform) {
            if (points.length === 0) return;

            ctx.beginPath();
            ctx.moveTo(
                points[0].x * transform.scale + transform.tx,
                points[0].y * transform.scale + transform.ty
            );

            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(
                    points[i].x * transform.scale + transform.tx,
                    points[i].y * transform.scale + transform.ty
                );
            }
            ctx.stroke();
        }

        /**
         * Main render function called by the window.
         * @param {number} t - Time in seconds
         */
        window.ksaRender = (t) => {
            // Normalize time for looping (0 to 1)
            const loopT = (t % DURATION) / DURATION;
            
            // Clear canvas
            const canvas = document.getElementById('stage');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // --- 1. Calculate Fish Motion ---
            
            // Fish moves steadily from right to left across the screen.
            // Start x: 400 (approximate original position), End x: -150 (to clear left side)
            const fishX = lerp(400, -150, loopT);
            
            // Fish bobs slightly up and down (sine wave)
            const fishY = 200 + Math.sin(loopT * Math.PI * 4) * 15;
            
            // Fish rotation (pitch) follows the bob
            const fishRot = Math.cos(loopT * Math.PI * 4) * 0.05;

            // --- 2. Calculate Tail Wag ---
            
            // Tail wag is a simple oscillating rotation around the pivot point (315, 265)
            // The pivot is roughly the middle of the tail base.
            const tailPivot = { x: 315, y: 265 };
            const wagSpeed = 15; // frequency
            const wagAmp = 0.15; // amplitude in radians
            
            // We use a slightly different phase for the tail so it feels organic
            // The tail moves faster when the fish reverses direction
            const tailRot = Math.sin(t * wagSpeed) * wagAmp;

            // --- 3. Calculate Bubble Motion ---
            
            // Bubbles drift upwards. They start near the fish mouth and float up.
            // We need them to reset periodically to maintain the animation loop.
            // Let's assume the bubbles are "released" by the fish swimming.
            
            const bubbleBaseSpeed = 0.4; // Vertical speed factor
            const bubbleOffset1 = 0.2;   // Phase offset for bubble 1
            const bubbleOffset2 = 0.6;   // Phase offset for bubble 2

            // Bubble 1
            let b1T = (loopT + bubbleOffset1) % 1;
            // Ease out the bubble rising so they float slower near top
            let b1Y = lerp(250, -50, easeOutQuad(b1T));
            let b1X = 130 + Math.sin(b1T * Math.PI * 2) * 20; // Slight wobble
            let b1Scale = 0.8 + b1T * 0.2; // Grow slightly

            // Bubble 2
            let b2T = (loopT + bubbleOffset2) % 1;
            let b2Y = lerp(300, -50, easeOutQuad(b2T));
            let b2X = 110 + Math.sin(b2T * Math.PI * 2 + 1) * 15;
            let b2Scale = 0.7 + b2T * 0.2;

            // --- 4. Draw ---

            // Setup shared style
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#1d1d1f';
            ctx.lineWidth = 3; // Base width, adjusted by path specific properties if needed

            // --- Draw Bubbles (Behind Fish) ---
            
            // Bubble 1
            ctx.save();
            ctx.translate(b1X, b1Y);
            ctx.scale(b1Scale, b1Scale);
            ctx.lineWidth = 2.5; // Original width for bubble
            drawPath(ctx, paths.b1, { tx: 0, ty: 0, rotation: 0, scale: 1 });
            ctx.restore();

            // Bubble 2
            ctx.save();
            ctx.translate(b2X, b2Y);
            ctx.scale(b2Scale, b2Scale);
            ctx.lineWidth = 2.5;
            drawPath(ctx, paths.b2, { tx: 0, ty: 0, rotation: 0, scale: 1 });
            ctx.restore();

            // --- Draw Fish ---

            // Group Fish Parts
            const fishTransform = { tx: fishX, ty: fishY, rotation: fishRot, scale: 1 };

            // 1. Body
            ctx.lineWidth = 4;
            drawPath(ctx, paths.body, fishTransform);

            // 2. Eye (Inside body, no extra transform needed relative to body for position, 
            //    but we might want a subtle blink? Let's keep it simple first.)
            ctx.lineWidth = 4;
            drawPath(ctx, paths.eye, fishTransform);

            // 3. Fin (Top)
            ctx.lineWidth = 3;
            drawPath(ctx, paths.fin, fishTransform);

            // 4. Tail (Rotates around pivot)
            ctx.lineWidth = 4;
            
            // To rotate the tail correctly, we need to translate to the pivot, rotate, then move to fish position
            // But our drawPath function applies transform at the end.
            // So we construct a transform that:
            // 1. Translates to pivot point (relative to fish origin which is 0,0 in path space)
            // 2. Rotates
            // 3. Translates to current fish position on screen
            
            // Pivot in path space is approx (315, 265)
            // We want to rotate around this point.
            // The transform logic in drawPath is: x * scale + tx.
            // To rotate around a point P, we translate by -P, rotate, translate by P.
            // Then we add the global fish translation.
            
            // Let's do this manually for the tail to be precise.
            ctx.save();
            // Move to pivot point in path space, then to screen
            ctx.translate(tailPivot.x, tailPivot.y);
            ctx.rotate(tailRot);
            // Move from pivot to fish position
            ctx.translate(fishX - tailPivot.x, fishY - tailPivot.y);
            ctx.lineWidth = 4;
            drawPath(ctx, paths.tail, { tx: 0, ty: 0, rotation: 0, scale: 1 });
            ctx.restore();

            // Draw a small dot for the eye pupil to make it cute? 
            // The prompt says "reuse paths verbatim". The eye path is a circle.
            // We'll leave it as is.

        };

        // Helper easing for bubbles
        function easeOutQuad(t) {
            return 1 - (1 - t) * (1 - t);
        }

        // Initial draw
        window.ksaRender(0);

    </script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

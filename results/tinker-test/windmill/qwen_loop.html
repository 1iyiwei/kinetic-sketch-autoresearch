            /* The drawing is a sketch, so a rough paper border fits well */

            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

<body>

<div id="stage"></div>

      <path id="s5" d="M250.6,248.6 L247.1,259.6 L243.6,270.8 L239.4,282.1 L235.4,292.9 L231.0,305.1 L226.4,316.7 L222.1,327.7 L217.4,338.4 L214.1,350.3 L210.5,362.1 L207.0,372.8 L202.8,384.2 L198.6,396.2 L197.5,394.4 L195.4,392.1 L194.3,389.9 L193.0,387.8 L191.2,385.9 L189.7,383.3 L189.0,381.0 L187.2,378.0 L185.6,375.6 L185.0,373.7 L183.3,371.0 L182.4,368.2 L180.8,365.1 L184.9,356.3 L189.8,347.6 L194.3,339.3 L199.1,329.7 L203.1,321.4 L208.6,313.0 L213.4,303.5 L217.4,294.1 L221.7,285.7 L227.0,277.0 L231.2,267.5 L235.7,259.1 L240.0,250.4" fill="none" stroke="#1d1d1f" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>

      <path id="s7" d="M261.0,223.1 L265.2,211.8 L270.0,200.3 L273.3,189.3 L277.3,178.1 L281.6,166.4 L285.2,154.5 L289.7,143.9 L294.1,132.1 L298.8,121.4 L302.7,109.4 L307.1,98.4 L311.2,86.5 L315.4,74.8 L316.4,76.9 L317.4,80.1 L319.0,83.1 L319.9,85.3 L321.3,87.0 L322.5,90.2 L324.1,93.0 L325.1,95.5 L326.8,98.0 L328.0,99.7 L328.6,102.6 L330.6,104.4 L332.3,106.6 L327.7,116.0 L322.6,125.0 L317.6,133.8 L312.2,142.3 L307.4,151.9 L302.4,161.1 L297.4,170.5 L292.6,178.6 L287.9,188.1 L283.8,197.4 L279.4,205.5 L274.7,214.2 L270.9,222.6" fill="none" stroke="#1d1d1f" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`
];

// The hub is at (257, 249)
const HUB_X = 257;
const HUB_Y = 249;

// Blade paths that need to rotate
const BLADE_IDS = ['s3', 's4', 's5', 's6', 's7'];

// Static paths
const STATIC_IDS = ['s1', 's2'];

window.ksaRender = (t) => {
    const container = document.getElementById('stage');
    // Clear previous frame
    while (container.firstChild) {
        container.removeChild(container.firstChild);
    }

    // Parse the base SVG
    const parser = new DOMParser();
    const doc = parser.parseFromString(svgData[0], 'image/svg+xml');
    const svgEl = doc.documentElement;
    
    // Get the SVG element
    const ns = "http://www.w3.org/2000/svg";
    const staticSvg = svgEl.cloneNode(true);
    
    // 1. Draw Static Elements (Tower, Ground)
    // We append the static paths directly to the stage SVG
    const staticPaths = staticSvg.querySelectorAll('#s1, #s2');
    const stageSvg = createStageSVG();
    staticPaths.forEach(p => {
        stageSvg.appendChild(p.cloneNode(true));
    });

    // 2. Draw Animated Elements (Blades)
    // Calculate rotation
    // 4 seconds for full rotation = 90 deg/sec
    const angleDeg = (t * 90) % 360;
    
    const bladeSvg = staticSvg.cloneNode(true);
    const bladePaths = bladeSvg.querySelectorAll('#s3, #s4, #s5, #s6, #s7');
    
    // Create a group for the blades
    const g = document.createElementNS(ns, 'g');
    g.setAttribute('transform', `translate(${HUB_X}, ${HUB_Y}) rotate(${angleDeg}) translate(${-HUB_X}, ${-HUB_Y})`);
    
    bladePaths.forEach(p => {
        g.appendChild(p.cloneNode(true));
    });
    
    stageSvg.appendChild(g);
    
    // Add the hub circle (animated)
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', HUB_X);
    circle.setAttribute('cy', HUB_Y);
    circle.setAttribute('r', 5);
    circle.setAttribute('fill', '#1d1d1f');
    // The hub rotates with the blades, but since it's a circle, it looks the same.
    // However, to strictly follow "animate with transforms", we attach it to the group.
    // But for a perfect sketch, we can just place it in the group.
    // Let's add it to the group g.
    g.appendChild(circle);

    // Add the hub circle (static) - wait, the hub is part of the blades in the drawing.
    // "s3" is the hub. It rotates. So it should be in the group.
    // We removed 's3' from static and added it to blades.
    // But we also want a little center pin.
    // Let's add a small center pin that stays static to anchor the visual? 
    // The prompt says "The drawing's look... reuse... verbatim".
    // The drawing has 's3' at the center. 's3' rotates.
    // I will leave 's3' in the rotating group.
    
    container.appendChild(stageSvg);
};

function createStageSVG() {
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("xmlns", ns);
    svg.setAttribute("viewBox", "0 0 512 512");
    svg.setAttribute("width", "512");
    svg.setAttribute("height", "512");
    // White background
    const rect = document.createElementNS(ns, "rect");
    rect.setAttribute("width", "512");
    rect.setAttribute("height", "512");
    rect.setAttribute("fill", "#ffffff");
    svg.appendChild(rect);
    return svg;
}
</script>


<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

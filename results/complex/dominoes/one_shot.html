<script>
(function(){
  const DURATION = 4.0;
  const $ = id => document.getElementById(id);

  const ball = $("ball");
  const arrow = $("arrow");
  const fx = $("fx");

  const dominos = [
    {el:$("d1"), x:199, y:420, start:0.82, dur:0.44, final:86},
    {el:$("d2"), x:241, y:419, start:1.14, dur:0.42, final:86},
    {el:$("d3"), x:283, y:420, start:1.46, dur:0.42, final:86},
    {el:$("d4"), x:325, y:420, start:1.78, dur:0.42, final:86},
    {el:$("d5"), x:368, y:420, start:2.10, dur:0.42, final:86},
    {el:$("d6"), x:410, y:419, start:2.42, dur:0.42, final:86},
    {el:$("d7"), x:451, y:420, start:2.74, dur:0.72, final:91}
  ];

  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function smooth(u){ u=clamp(u,0,1); return u*u*(3-2*u); }
  function easeOutBack(u){
    u=clamp(u,0,1);
    const c1=1.55, c3=c1+1;
    return 1 + c3*Math.pow(u-1,3) + c1*Math.pow(u-1,2);
  }
  function easeInOut(u){
    u=clamp(u,0,1);
    return u<0.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2,3)/2;
  }
  function pulse(t, c, w){
    const u = Math.abs(t-c)/w;
    return u>=1 ? 0 : 1-u;
  }

  window.ksaRender = function(t){
    t = clamp(t, 0, DURATION);

    // Ball rolls right, with a tiny anticipation wobble after contact.
    let bx;
    if (t < 0.82) {
      bx = 86 * easeInOut(t / 0.82);
    } else {
      bx = 86 + 5 * Math.exp(-(t-0.82)*5) * Math.sin((t-0.82)*18);
    }
    const rot = (bx / 24) * 57.2958; // rough rolling rotation
    ball.setAttribute("transform", `translate(${bx.toFixed(3)} 0) rotate(${rot.toFixed(3)} 80.5 397)`);

    // The original arrow is part of the first frame; then it skitters away/fades.
    const ao = t < 0.05 ? 1 : clamp(1 - (t-0.05)/0.45, 0, 1);
    const ax = t < 0.05 ? 0 : 10 * smooth((t-0.05)/0.45);
    arrow.setAttribute("opacity", ao.toFixed(3));
    arrow.setAttribute("transform", `translate(${ax.toFixed(3)} 0)`);

    // Impact burst at the first domino.
    const fxo = Math.max(pulse(t,0.84,0.13), pulse(t,1.15,0.08)*0.45);
    fx.setAttribute("opacity", fxo.toFixed(3));
    fx.setAttribute("transform", `translate(${(2*Math.sin(t*45)*fxo).toFixed(2)} ${(1*Math.cos(t*35)*fxo).toFixed(2)})`);

    // Topple dominoes in a cascading chain.
    dominos.forEach((d, i) => {
      let a = 0;
      if (t > d.start) {
        const u = (t - d.start) / d.dur;
        if (u < 1) {
          a = d.final * easeOutBack(u);
        } else {
          // Small settling wobble after each hit; the last one lands flat and rests.
          const settle = Math.exp(-(t - d.start - d.dur) * 5.2) * Math.sin((t - d.start - d.dur) * 18);
          const wob = (i === dominos.length-1 ? 3.2 : 2.0) * settle;
          a = d.final + wob;
        }
      }

      // The last domino makes a clear slap-flat landing with a tiny rebound.
      if (i === dominos.length-1 && t > d.start + d.dur) {
        const r = t - d.start - d.dur;
        a = 91 - 2.2*Math.exp(-r*7)*Math.cos(r*22);
      }

      d.el.setAttribute("transform", `rotate(${a.toFixed(3)} ${d.x} ${d.y})`);
    });
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

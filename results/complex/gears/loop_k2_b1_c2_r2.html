<script>
(function () {
  const DURATION = 4.0;

  const big = document.getElementById("bigGear");
  const small = document.getElementById("smallGear");
  const hints = document.getElementById("motionHints");
  const hintBig1 = document.getElementById("hintBig1");
  const hintBig2 = document.getElementById("hintBig2");
  const hintSmall1 = document.getElementById("hintSmall1");
  const hintSmall2 = document.getElementById("hintSmall2");

  // Centers read from the drawn hub geometry.
  const bigCx = 196.2, bigCy = 270.1;
  const smallCx = 375.2, smallCy = 270.6;

  // Pitch-radius ratio chosen from the contact geometry: distance between centers is ~179,
  // with effective pitch radii about 110 and 69.5. This keeps the drawn teeth in phase.
  const ratio = 110 / 69.5;

  // Big gear makes a steady half-turn in 4 seconds; small gear counter-rotates faster.
  const bigDegreesPerSecond = 45;

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    const bigAngle = bigDegreesPerSecond * t;
    const smallAngle = -bigAngle * ratio;

    big.setAttribute("transform", "rotate(" + bigAngle + " " + bigCx + " " + bigCy + ")");
    small.setAttribute("transform", "rotate(" + smallAngle + " " + smallCx + " " + smallCy + ")");

    // Subtle hand-drawn diagram motion ticks. They fade in after the exact first frame.
    const fadeIn = smoothstep(t / 0.45);
    const pulse = 0.45 + 0.35 * Math.sin(t * Math.PI * 2.0);
    const op = fadeIn * pulse;
    hints.setAttribute("opacity", op.toFixed(3));

    // Tiny sliding offsets give the motion hints a non-mechanical whiteboard feel,
    // while the actual gear paths remain true rotations about their hubs.
    const drift = 3 * Math.sin(t * Math.PI * 2);
    hintBig1.setAttribute("transform", "translate(" + drift.toFixed(2) + " 0)");
    hintBig2.setAttribute("transform", "translate(" + (-drift).toFixed(2) + " 0)");
    hintSmall1.setAttribute("transform", "translate(" + (-drift * 0.7).toFixed(2) + " 0)");
    hintSmall2.setAttribute("transform", "translate(" + (drift * 0.7).toFixed(2) + " 0)");
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>

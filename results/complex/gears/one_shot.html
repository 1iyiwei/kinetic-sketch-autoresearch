<script>
(function () {
  const DURATION = 4.0;

  const largeGear = document.getElementById("largeGear");
  const smallGear = document.getElementById("smallGear");
  const meshCue = document.getElementById("meshCue");

  // Centers taken from the drawn hub geometry.
  const bigCx = 196.0, bigCy = 270.0;
  const smallCx = 375.5, smallCy = 270.5;

  // Tooth-count / pitch-radius ratio: the small gear is about 2/3 the large gear,
  // so it turns 1.5x as fast in the opposite direction.
  const ratio = 1.5;

  window.ksaRender = function (t) {
    t = Math.max(0, Math.min(DURATION, Number(t) || 0));

    // Constant angular velocity keeps the teeth locked together:
    // equal tangential travel at the pitch contact, opposite rotation.
    const turns = t / DURATION;
    const bigAngle = 360 * turns;
    const smallAngle = -360 * ratio * turns;

    largeGear.setAttribute(
      "transform",
      "rotate(" + bigAngle.toFixed(6) + " " + bigCx + " " + bigCy + ")"
    );
    smallGear.setAttribute(
      "transform",
      "rotate(" + smallAngle.toFixed(6) + " " + smallCx + " " + smallCy + ")"
    );

    // A tiny intermittent contact shimmer, fully absent on the anchor frame.
    // It is deterministic and tied to the meshing rhythm.
    let cue = 0;
    if (t > 0 && t < DURATION) {
      const phase = (turns * 24) % 1;
      cue = Math.max(0, 1 - Math.abs(phase - 0.18) / 0.18) * 0.22;
    }
    meshCue.setAttribute("opacity", cue.toFixed(4));
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

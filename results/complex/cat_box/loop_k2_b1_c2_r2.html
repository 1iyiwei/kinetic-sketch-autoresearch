<script>
(function () {
  const cat = document.getElementById("cat");
  const effects = document.getElementById("effects");
  const dust1 = document.getElementById("dust1");
  const dust2 = document.getElementById("dust2");
  const whoosh1 = document.getElementById("whoosh1");
  const whoosh2 = document.getElementById("whoosh2");
  const land1 = document.getElementById("land1");
  const land2 = document.getElementById("land2");

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (a, b, p) => a + (b - a) * p;
  const smooth = p => p * p * (3 - 2 * p);
  const easeIn = p => p * p * p;
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeInOut = p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

  function setOp(el, v) {
    el.setAttribute("opacity", String(clamp(v, 0, 1)));
  }

  window.ksaRender = function(t) {
    t = clamp(t, 0, 4.0);

    let x = 0, y = 0, sx = 1, sy = 1, rot = 0;
    let pivotX = 150, pivotY = 438;

    // exact anchor: no transform or visible additions
    if (t === 0) {
      cat.removeAttribute("transform");
      effects.setAttribute("opacity", "0");
      return;
    }

    // 0.00 - 0.55: anticipation crouch, feet planted on ground
    if (t < 0.55) {
      const p = smooth(t / 0.55);
      sx = mix(1, 1.10, p);
      sy = mix(1, 0.82, p);
      rot = mix(0, -2.5, p);
      x = 0;
      y = 0;
    }

    // 0.55 - 0.75: spring release upward from crouch
    else if (t < 0.75) {
      const p = easeOut((t - 0.55) / 0.20);
      sx = mix(1.10, 0.92, p);
      sy = mix(0.82, 1.13, p);
      rot = mix(-2.5, 5, p);
      x = mix(0, 16, p);
      y = mix(0, -35, p);
    }

    // 0.75 - 2.28: leap in a broad arc to the box top
    else if (t < 2.28) {
      const p = (t - 0.75) / 1.53;
      const q = easeInOut(p);
      x = mix(16, 223, q);
      y = mix(-35, -120, q) - 118 * Math.sin(Math.PI * p);
      sx = mix(0.92, 1.02, smooth(p));
      sy = mix(1.13, 0.98, smooth(p));
      rot = 7 * Math.sin(Math.PI * p) - 3 * p;
    }

    // 2.28 - 2.60: landing squash on the box top
    else if (t < 2.60) {
      const p = (t - 2.28) / 0.32;
      x = 223;
      y = -120;
      pivotX = 373;
      pivotY = 318;
      const hit = Math.sin(Math.PI * p);
      sx = 1 + 0.13 * hit;
      sy = 1 - 0.18 * hit;
      rot = mix(-3, 1.5, smooth(p));
    }

    // 2.60 - 3.25: rebound and settle
    else if (t < 3.25) {
      const p = (t - 2.60) / 0.65;
      x = 223;
      y = -120 - 10 * Math.sin(Math.PI * p) * (1 - p);
      pivotX = 373;
      pivotY = 318;
      sx = 1 - 0.05 * Math.sin(Math.PI * p) * (1 - p);
      sy = 1 + 0.08 * Math.sin(Math.PI * p) * (1 - p);
      rot = 1.5 * Math.sin(Math.PI * (1 - p));
    }

    // 3.25 - 4.00: sitting calmly on top
    else {
      const p = (t - 3.25) / 0.75;
      x = 223;
      y = -120;
      pivotX = 373;
      pivotY = 318;
      const breathe = Math.sin(p * Math.PI * 2) * 0.012 * (1 - p);
      sx = 1 + breathe;
      sy = 1 - breathe;
      rot = 0;
    }

    const tf =
      `translate(${x.toFixed(3)} ${y.toFixed(3)}) ` +
      `translate(${pivotX} ${pivotY}) ` +
      `rotate(${rot.toFixed(3)}) ` +
      `scale(${sx.toFixed(4)} ${sy.toFixed(4)}) ` +
      `translate(${-pivotX} ${-pivotY})`;
    cat.setAttribute("transform", tf);

    // Effects: pure time-based visibility
    effects.setAttribute("opacity", "1");

    const takeoff = clamp(1 - Math.abs(t - 0.68) / 0.28, 0, 1);
    const air = clamp(1 - Math.abs(t - 1.28) / 0.45, 0, 1);
    const landing = clamp(1 - Math.abs(t - 2.36) / 0.25, 0, 1);

    setOp(dust1, takeoff);
    setOp(dust2, takeoff * 0.8);
    setOp(whoosh1, air * 0.65);
    setOp(whoosh2, air * 0.45);
    setOp(land1, landing);
    setOp(land2, landing * 0.9);

    const dustSpread = 1 + takeoff * 0.35;
    dust1.setAttribute("transform", `translate(${-18 * takeoff} ${3 * takeoff}) scale(${dustSpread})`);
    dust2.setAttribute("transform", `translate(${18 * takeoff} ${2 * takeoff}) scale(${dustSpread})`);
    whoosh1.setAttribute("transform", `translate(${80 * air} ${-42 * air})`);
    whoosh2.setAttribute("transform", `translate(${95 * air} ${-58 * air})`);
    land1.setAttribute("transform", `translate(${-7 * landing} ${6 * landing})`);
    land2.setAttribute("transform", `translate(${7 * landing} ${6 * landing})`);
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

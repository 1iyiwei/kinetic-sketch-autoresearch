<script>
(function () {
  const cat = document.getElementById("cat");
  const box = document.getElementById("box");
  const shadow = document.getElementById("jumpShadow");
  const lines = document.getElementById("motionLines");

  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const lerp = (a, b, p) => a + (b - a) * p;
  const easeInOut = p => p < 0.5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
  const easeOut = p => 1 - Math.pow(1 - p, 3);
  const easeIn = p => p*p*p;

  function catTransform(tx, ty, rot, sx, sy) {
    const px = 150, py = 438;
    return `translate(${tx.toFixed(3)} ${ty.toFixed(3)}) translate(${px} ${py}) rotate(${rot.toFixed(3)}) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(${-px} ${-py})`;
  }

  window.ksaRender = function(t) {
    t = clamp(t, 0, 4.0);

    let tx = 0, ty = 0, rot = 0, sx = 1, sy = 1;
    let shadowOpacity = 0, shadowRx = 42, shadowCx = 150;
    let lineOpacity = 0;
    let boxTransform = "";

    if (t <= 0) {
      cat.setAttribute("transform", "");
      box.setAttribute("transform", "");
      shadow.setAttribute("opacity", "0");
      lines.setAttribute("opacity", "0");
      return;
    }

    if (t < 0.7) {
      // Anticipation: crouch lower, compressing around the paws.
      const p = easeInOut(t / 0.7);
      tx = lerp(0, -6, p);
      ty = 0;
      sx = lerp(1, 1.10, p);
      sy = lerp(1, 0.82, p);
      rot = lerp(0, -3, p);
      shadowOpacity = 0;
      lineOpacity = 0;
    } else if (t < 2.25) {
      // Leap: broad parabolic arc from ground to box top.
      const raw = (t - 0.7) / 1.55;
      const p = easeInOut(raw);

      tx = lerp(-6, 223, p);
      ty = lerp(0, -120, p) - Math.sin(Math.PI * raw) * 128;

      // Recover from crouch into a stretched airborne pose.
      const stretch = Math.sin(Math.PI * raw);
      sx = 1.02 - 0.08 * stretch;
      sy = 0.98 + 0.16 * stretch;

      // Little cartoon body rotation following the arc.
      rot = lerp(-8, 10, raw);
      if (raw > 0.62) rot = lerp(10, -2, (raw - 0.62) / 0.38);

      shadowOpacity = 0.16 * Math.sin(Math.PI * raw);
      shadowRx = lerp(32, 18, Math.sin(Math.PI * raw));
      shadowCx = lerp(150, 373, p);

      lineOpacity = raw < 0.28 ? (1 - raw / 0.28) * 0.55 : 0;
    } else if (t < 3.05) {
      // Landing: squash, overshoot, and settle on the box.
      const p = (t - 2.25) / 0.8;
      tx = 223;
      ty = -120;

      const wobble = Math.exp(-4.2 * p) * Math.sin(p * Math.PI * 4.5);
      sx = 1 + 0.18 * Math.exp(-5 * p) * Math.sin(p * Math.PI);
      sy = 1 - 0.18 * Math.exp(-5 * p) * Math.sin(p * Math.PI);
      rot = -2 * (1 - p) + wobble * 4;

      // Box gives a tiny soft bounce under the cat.
      const bp = Math.exp(-5 * p) * Math.sin(p * Math.PI * 2.2);
      boxTransform = `translate(373 440) scale(${(1 + 0.006 * bp).toFixed(4)} ${(1 - 0.018 * Math.abs(bp)).toFixed(4)}) translate(-373 -440)`;

      shadowOpacity = 0;
      lineOpacity = 0;
    } else {
      // Final: seated calmly on top.
      const p = (t - 3.05) / 0.95;
      tx = 223;
      ty = -120;
      rot = 0.6 * Math.exp(-4 * p) * Math.sin(p * Math.PI * 3);
      sx = 1;
      sy = 1;
      shadowOpacity = 0;
      lineOpacity = 0;
    }

    cat.setAttribute("transform", catTransform(tx, ty, rot, sx, sy));
    box.setAttribute("transform", boxTransform);
    shadow.setAttribute("cx", shadowCx.toFixed(2));
    shadow.setAttribute("rx", shadowRx.toFixed(2));
    shadow.setAttribute("opacity", shadowOpacity.toFixed(3));
    lines.setAttribute("opacity", lineOpacity.toFixed(3));
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

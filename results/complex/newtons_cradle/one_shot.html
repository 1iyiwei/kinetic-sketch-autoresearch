<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Newton's Cradle Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }
    canvas {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
<canvas id="stage" width="512" height="512"></canvas>

<script>
(() => {
  const canvas = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  const DURATION = 4.0;

  const paths = {
    s1: new Path2D("M115.5,92.3 L128.0,92.2 L139.8,92.6 L152.5,92.5 L164.7,92.0 L176.2,91.8 L188.6,91.2 L201.3,91.0 L213.1,90.5 L226.0,91.2 L238.6,91.5 L250.0,91.4 L262.1,90.9 L274.9,91.0 L286.5,91.6 L298.1,92.3 L310.3,92.3 L322.4,92.2 L334.2,91.5 L347.1,91.2 L359.7,91.0 L372.5,91.7 L384.9,92.2 L397.0,92.5"),
    s2: new Path2D("M125.5,92.0 L126.0,118.3 L126.6,145.7 L126.4,172.3 L126.2,198.9 L126.9,225.5 L126.0,251.8 L126.3,279.4 L126.3,306.2 L126.3,333.3 L125.8,360.1 L125.9,387.0 L125.5,413.2 L125.4,440.6"),
    s3: new Path2D("M385.8,92.1 L385.5,118.3 L385.0,145.6 L385.6,172.2 L385.9,199.2 L386.5,226.6 L386.3,254.0 L386.9,280.6 L387.3,307.1 L386.8,333.3 L387.2,359.5 L386.3,386.8 L386.7,413.4 L387.0,439.5"),
    s4: new Path2D("M89.7,439.7 L104.0,439.3 L117.9,439.2 L133.1,440.1 L148.0,440.0 L162.0,440.7 L176.5,440.9 L190.3,440.3 L205.4,440.6 L220.4,440.7 L234.6,440.6 L249.5,440.2 L263.8,439.9 L278.5,439.2 L293.1,440.0 L306.6,440.1 L321.2,440.6 L335.7,440.1 L350.0,440.8 L365.0,440.1 L378.7,439.5 L392.4,439.5 L406.5,440.1 L421.4,439.6"),
    s5: new Path2D("M168.1,93.7 L160.2,104.3 L151.9,115.0 L143.9,126.4 L136.3,136.8 L128.8,148.5 L121.4,159.9 L112.7,170.8 L104.3,182.1 L96.2,193.2 L88.2,204.3 L80.4,214.5 L72.7,225.1 L65.6,235.9 L57.9,247.0 L50.7,257.4"),
    s6: new Path2D("M70.6,274.1 L71.7,279.2 L71.3,283.9 L70.2,288.3 L67.5,292.6 L65.5,295.8 L61.6,299.2 L57.0,300.4 L52.0,301.8 L48.1,301.7 L43.9,300.0 L40.0,298.2 L36.3,295.4 L33.1,291.7 L30.3,287.8 L28.8,283.9 L29.1,279.7 L29.7,274.8 L31.2,270.6 L34.0,267.5 L36.6,264.1 L40.6,262.0 L45.6,260.7 L50.3,260.3 L55.0,261.1 L59.5,262.4 L63.0,265.0 L66.1,268.0 L69.2,272.1 L71.6,275.2 L71.9,279.2 L71.4,283.2"),
    s7: new Path2D("M212.1,93.4 L211.8,107.4 L212.2,120.5 L211.6,134.3 L212.0,146.9 L211.7,160.3 L212.0,173.1 L212.7,186.1 L212.2,199.8 L211.7,213.2 L211.3,226.5 L211.1,239.4 L211.9,252.5 L211.8,265.9 L211.6,278.6 L211.5,291.5"),
    s8: new Path2D("M231.6,308.5 L231.9,313.2 L232.6,317.9 L230.9,322.1 L228.3,326.2 L226.1,329.2 L222.0,332.0 L217.6,333.7 L213.4,335.4 L208.9,334.8 L205.2,334.4 L201.1,331.9 L197.1,329.2 L194.3,325.4 L192.6,322.1 L191.9,318.3 L190.8,313.8 L190.9,309.8 L193.0,305.7 L195.1,301.0 L198.9,297.9 L203.0,295.4 L207.7,293.6 L211.7,292.8 L216.0,293.4 L220.9,294.2 L224.1,296.6 L227.8,299.3 L230.1,302.6 L231.2,307.1 L232.5,312.0 L231.9,316.1"),
    s9: new Path2D("M256.6,94.1 L256.4,107.5 L256.6,120.7 L255.9,134.3 L255.5,146.7 L255.4,160.0 L255.7,172.7 L256.1,186.0 L255.6,199.8 L256.1,213.5 L256.3,226.2 L256.7,239.9 L256.6,253.6 L257.1,266.4 L257.5,280.0 L257.7,292.3"),
    s10: new Path2D("M275.8,308.0 L276.9,312.8 L277.0,316.7 L276.5,321.2 L274.9,324.9 L272.5,328.6 L269.0,331.8 L265.1,333.6 L259.7,334.6 L254.5,334.8 L250.5,333.8 L245.6,331.3 L241.8,329.0 L238.1,325.9 L235.6,321.4 L235.1,317.3 L235.4,312.8 L235.4,308.1 L237.0,304.1 L239.9,300.8 L243.3,297.2 L247.0,294.7 L251.3,292.9 L255.8,292.4 L259.6,293.4 L264.2,295.2 L268.5,297.8 L272.6,300.5 L274.9,303.5 L276.8,307.9 L277.6,313.1 L276.8,317.2"),
    s11: new Path2D("M300.3,94.4 L300.2,106.9 L300.0,120.6 L300.0,133.7 L299.8,147.1 L300.0,160.5 L300.5,174.0 L300.3,186.7 L300.6,200.2 L301.1,212.9 L301.4,226.6 L300.5,239.4 L300.6,252.1 L300.9,265.0 L301.0,278.0 L300.4,291.0"),
    s12: new Path2D("M320.1,308.1 L320.5,312.8 L320.2,317.4 L319.1,321.3 L316.7,324.7 L314.3,328.3 L310.3,331.8 L306.7,333.1 L302.7,334.4 L298.1,334.6 L294.3,333.6 L290.2,332.1 L286.2,329.2 L283.5,326.1 L281.1,322.2 L279.3,318.2 L278.3,313.8 L279.0,308.8 L280.9,304.7 L282.8,300.8 L285.8,298.0 L289.6,295.3 L293.7,293.0 L298.1,292.1 L303.1,293.2 L307.3,294.1 L311.5,295.9 L314.9,299.6 L317.3,303.8 L319.3,307.4 L319.9,312.2 L319.3,316.4"),
    s13: new Path2D("M344.1,94.5 L344.1,107.8 L343.4,120.6 L343.2,134.4 L343.2,147.8 L342.7,160.8 L343.5,174.2 L343.7,186.8 L344.4,199.3 L345.0,213.0 L345.1,226.2 L344.4,239.1 L344.6,252.5 L344.3,266.2 L343.6,278.9 L343.1,291.9"),
    s14: new Path2D("M364.5,308.2 L364.8,312.3 L364.1,317.1 L363.1,321.0 L361.0,325.7 L358.2,329.4 L354.9,332.1 L351.0,333.9 L346.2,334.9 L341.5,334.8 L336.7,334.5 L332.6,332.2 L328.5,329.1 L326.3,325.6 L324.4,321.3 L323.4,317.1 L323.4,312.7 L323.8,308.0 L325.5,304.4 L328.2,300.6 L331.1,298.0 L335.4,295.0 L339.9,293.8 L344.5,293.9 L349.4,293.8 L354.2,294.8 L357.6,297.8 L360.3,300.6 L363.0,303.9 L364.3,308.5 L365.2,313.3 L365.4,318.2")
  };

  function easeInOutSine(x) {
    x = Math.max(0, Math.min(1, x));
    return -(Math.cos(Math.PI * x) - 1) / 2;
  }

  function smoothPulse(t, a, b) {
    if (t < a || t > b) return 0;
    const u = (t - a) / (b - a);
    return Math.sin(Math.PI * u);
  }

  function dampedHit(t, hit, amp, decay, freq) {
    if (t < hit) return 0;
    const u = t - hit;
    return amp * Math.exp(-decay * u) * Math.sin(freq * u);
  }

  function leftAngle(t) {
    // Original drawing is the raised pose. Positive rotation swings the bob down.
    const maxDown = 43 * Math.PI / 180;
    let a = 0;

    // First swing down.
    if (t <= 0.78) {
      a = maxDown * easeInOutSine(t / 0.78);
    } else {
      a = maxDown;
    }

    // After the returning right ball hits, the left ball is kicked back up,
    // then falls again for the repeat.
    if (t > 1.82) {
      const u = Math.min(1, (t - 1.82) / 0.58);
      a = maxDown * (1 - easeInOutSine(u));
    }
    if (t > 2.40) {
      const u = Math.min(1, (t - 2.40) / 0.72);
      a = maxDown * easeInOutSine(u);
    }
    if (t > 3.12) {
      a = maxDown;
    }

    // tiny contact shiver
    a += dampedHit(t, 0.78, 0.018, 7, 36);
    a += dampedHit(t, 3.12, 0.014, 7, 36);
    return a;
  }

  function rightAngle(t) {
    const maxOut = 32 * Math.PI / 180;
    let a = 0;

    // Right ball receives impulse, swings out and back.
    if (t >= 0.78 && t <= 1.82) {
      const u = (t - 0.78) / 1.04;
      a = maxOut * Math.sin(Math.PI * u);
    }

    // Repeat exchange.
    if (t >= 3.12 && t <= 4.0) {
      const u = (t - 3.12) / 0.88;
      a = maxOut * Math.sin(Math.PI * u);
    }

    a += dampedHit(t, 0.78, 0.012, 8, 42);
    a += dampedHit(t, 3.12, 0.010, 8, 42);
    return a;
  }

  function middleJiggle(t, index) {
    // Middle bobs stay almost still, but transmit a small compression ripple.
    const delay = index * 0.035;
    let x = dampedHit(t, 0.78 + delay, 2.0, 10, 42);
    x += dampedHit(t, 1.82 + delay, -1.5, 10, 42);
    x += dampedHit(t, 3.12 + delay, 1.5, 10, 42);
    return x;
  }

  function drawPath(id, width) {
    ctx.lineWidth = width;
    ctx.strokeStyle = "#1d1d1f";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke(paths[id]);
  }

  function drawGroup(ids, pivotX, pivotY, angle, translateX = 0) {
    ctx.save();
    ctx.translate(translateX, 0);
    ctx.translate(pivotX, pivotY);
    ctx.rotate(angle);
    ctx.translate(-pivotX, -pivotY);
    for (const [id, w] of ids) drawPath(id, w);
    ctx.restore();
  }

  function drawMotionLines(t) {
    if (t === 0) return;

    ctx.save();
    ctx.strokeStyle = "#1d1d1f";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.globalAlpha = 0.55;

    // Left bob speed marks during the drop.
    const leftFast = smoothPulse(t, 0.18, 0.76) + smoothPulse(t, 2.58, 3.08);
    if (leftFast > 0.05) {
      ctx.globalAlpha = 0.35 * leftFast;
      ctx.beginPath();
      ctx.moveTo(77, 254);
      ctx.quadraticCurveTo(100, 277, 131, 288);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(70, 240);
      ctx.quadraticCurveTo(101, 263, 137, 271);
      ctx.stroke();
    }

    // Right swing speed marks.
    const rightFast = smoothPulse(t, 0.90, 1.32) + smoothPulse(t, 3.25, 3.72);
    if (rightFast > 0.05) {
      ctx.globalAlpha = 0.32 * rightFast;
      ctx.beginPath();
      ctx.moveTo(371, 288);
      ctx.quadraticCurveTo(404, 302, 424, 329);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(378, 273);
      ctx.quadraticCurveTo(413, 288, 433, 315);
      ctx.stroke();
    }

    // Small impact flash at contact moments.
    const flash = smoothPulse(t, 0.75, 0.86) + smoothPulse(t, 3.09, 3.20);
    if (flash > 0.05) {
      ctx.globalAlpha = 0.8 * flash;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(184, 303);
      ctx.lineTo(176, 294);
      ctx.moveTo(189, 316);
      ctx.lineTo(177, 318);
      ctx.moveTo(188, 329);
      ctx.lineTo(178, 337);
      ctx.stroke();
    }

    ctx.restore();
  }

  window.ksaRender = (t) => {
    t = Math.max(0, Math.min(DURATION, t));

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 512, 512);

    // Background exactly as SVG.
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, 512, 512);

    // Frame / support.
    drawPath("s1", 6);
    drawPath("s2", 4);
    drawPath("s3", 4);
    drawPath("s4", 4);

    drawMotionLines(t);

    // Left raised pendulum: original paths, rotated about top hook.
    drawGroup([["s5", 2.5], ["s6", 4]], 168.1, 93.7, leftAngle(t));

    // Middle balls: nearly stationary, only tiny compression tremors.
    drawGroup([["s7", 2.5], ["s8", 4]], 212.1, 93.4, 0, middleJiggle(t, 0));
    drawGroup([["s9", 2.5], ["s10", 4]], 256.6, 94.1, 0, middleJiggle(t, 1) * 0.45);
    drawGroup([["s11", 2.5], ["s12", 4]], 300.3, 94.4, 0, middleJiggle(t, 2) * 0.35);

    // Right ball swings out and back around its top support.
    drawGroup([["s13", 2.5], ["s14", 4]], 344.1, 94.5, rightAngle(t));
  };

  // Draw the required anchor frame initially.
  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

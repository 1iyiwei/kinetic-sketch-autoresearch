<script>
(function () {
  const DURATION = 6.0;

  const el = id => document.getElementById(id);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const smooth = x => {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  };
  const easeOutBack = x => {
    x = clamp(x, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  };
  const easeOutBounce = x => {
    x = clamp(x, 0, 1);
    const n1 = 7.5625, d1 = 2.75;
    if (x < 1 / d1) return n1 * x * x;
    if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + .75;
    if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + .9375;
    return n1 * (x -= 2.625 / d1) * x + .984375;
  };

  const rainIds = ["r1","r2","r3","r4","r5","r6"];

  window.ksaRender = function(t) {
    t = clamp(t, 0, DURATION);

    const cloudP = smooth(t / 2.0);
    const drift = 250 * cloudP;
    const bob = (t === 0) ? 0 : Math.sin(t * 4.2) * 2.2 * cloudP;
    el("s11").setAttribute("transform", `translate(${drift.toFixed(3)} ${bob.toFixed(3)})`);

    const dimIn = smooth((t - 0.9) / 1.1);
    const dimOut = smooth((t - 4.0) / 1.1);
    const dim = 0.24 * dimIn * (1 - 0.55 * dimOut);
    el("dim").setAttribute("opacity", dim.toFixed(3));

    const sunPulse = t < 0.01 ? 1 : 1 + 0.025 * Math.sin(t * 5.5) * (1 - cloudP);
    el("sun").setAttribute("transform", `translate(372 112) scale(${sunPulse.toFixed(4)}) translate(-372 -112)`);

    const rainOn = smooth((t - 2.0) / 0.35) * (1 - smooth((t - 4.0) / 0.45));
    el("rain").setAttribute("opacity", rainOn.toFixed(3));

    for (let i = 0; i < rainIds.length; i++) {
      const phase = (t * 1.85 + i * 0.23) % 1;
      const y = phase * 62;
      const xwiggle = Math.sin((t + i) * 5) * 1.2;
      el(rainIds[i]).setAttribute("transform", `translate(${xwiggle.toFixed(2)} ${y.toFixed(2)})`);
      el(rainIds[i]).setAttribute("opacity", (rainOn * (0.35 + 0.65 * (1 - phase))).toFixed(3));
    }

    const splashPulse = rainOn * Math.max(0, Math.sin(t * 16));
    el("splash1").setAttribute("opacity", (0.65 * splashPulse).toFixed(3));
    el("splash2").setAttribute("opacity", (0.45 * Math.max(0, Math.sin(t * 16 + 1.7)) * rainOn).toFixed(3));

    const growRaw = (t - 4.05) / 1.35;
    const grow = easeOutBack(growRaw);
    const safeGrow = t < 4.05 ? 0 : grow;
    const stemScale = 1 + 1.25 * safeGrow;
    const topLift = -50 * safeGrow;
    const sway = safeGrow * Math.sin((t - 4.05) * 9) * 2.2 * (1 - smooth((t - 5.15) / 0.7));

    el("s12").setAttribute(
      "transform",
      `translate(256 450) rotate(${(sway * 0.35).toFixed(3)}) scale(1 ${stemScale.toFixed(4)}) translate(-256 -450)`
    );
    el("topPlant").setAttribute(
      "transform",
      `translate(${sway.toFixed(3)} ${topLift.toFixed(3)})`
    );

    const open = smooth((t - 5.0) / 0.8);
    el("flower").setAttribute("opacity", open.toFixed(3));
    const angles = [0, 72, 144, 216, 288];
    for (let i = 0; i < 5; i++) {
      const spread = open * 10;
      const scale = 0.15 + 0.85 * easeOutBounce(open);
      el("petal" + (i + 1)).setAttribute(
        "transform",
        `rotate(${angles[i]} 256 403) translate(0 ${(-spread).toFixed(3)}) scale(${scale.toFixed(3)})`
      );
    }
    el("center").setAttribute("transform", `scale(${(0.2 + 0.8 * open).toFixed(3)}) translate(${(256*(1/(0.2+0.8*open)-1)).toFixed(3)} ${(403*(1/(0.2+0.8*open)-1)).toFixed(3)})`);

    if (t === 0) {
      el("s11").setAttribute("transform", "");
      el("sun").setAttribute("transform", "");
      el("rain").setAttribute("opacity", "0");
      el("s12").setAttribute("transform", "");
      el("topPlant").setAttribute("transform", "");
      el("flower").setAttribute("opacity", "0");
      el("dim").setAttribute("opacity", "0");
      for (let i = 0; i < rainIds.length; i++) {
        el(rainIds[i]).setAttribute("transform", "");
        el(rainIds[i]).setAttribute("opacity", "0");
      }
      el("splash1").setAttribute("opacity", "0");
      el("splash2").setAttribute("opacity", "0");
    }
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 6.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

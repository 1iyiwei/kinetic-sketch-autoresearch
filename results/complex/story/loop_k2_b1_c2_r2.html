<script>
(function () {
  const DURATION = 6.0;
  const $ = (id) => document.getElementById(id);

  const cloud = $("cloud");
  const cloudMask = $("cloudMask");
  const sun = $("sun");
  const rain = $("rain");
  const plant = $("plant");
  const bud = $("bud");
  const petals = $("petals");
  const dim = $("dim");

  const rainDrops = ["r1","r2","r3","r4","r5","r6","r7","r8","r9"].map($);

  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function smooth(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }
  function easeOutBack(x) {
    x = clamp(x, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }
  function easeOutCubic(x) {
    x = clamp(x, 0, 1);
    return 1 - Math.pow(1 - x, 3);
  }

  window.ksaRender = function(t) {
    t = clamp(t, 0, DURATION);

    /* Beat 1: cloud drifts right, slightly bobbing, to cover the sun */
    const drift = smooth(t / 2.0);
    const cloudX = 225 * drift;
    const cloudY = drift === 0 ? 0 : Math.sin(t * Math.PI * 1.25) * 2.2 * drift;
    cloud.setAttribute("transform", (cloudX === 0 && cloudY === 0) ? "" : `translate(${cloudX.toFixed(3)} ${cloudY.toFixed(3)})`);
    cloudMask.setAttribute("opacity", t <= 0 ? "0" : (0.98 * drift).toFixed(3));

    /* Sun loses cheer while covered */
    const sunFade = smooth((t - 0.65) / 1.25);
    sun.setAttribute("opacity", (1 - 0.55 * sunFade).toFixed(3));

    const dimIn = smooth((t - 0.75) / 1.25);
    const dimOutForFlower = smooth((t - 4.15) / 1.3);
    const dimAmt = 0.20 * dimIn * (1 - 0.75 * dimOutForFlower);
    dim.setAttribute("opacity", dimAmt.toFixed(3));

    /* Beat 2: rain falls from the cloud; each drop is offset for looping motion */
    const rainWindow = smooth((t - 1.85) / 0.35) * (1 - smooth((t - 3.85) / 0.45));
    rain.setAttribute("opacity", rainWindow.toFixed(3));
    const baseX = cloudX;
    for (let i = 0; i < rainDrops.length; i++) {
      const phase = (t * 1.65 + i * 0.23) % 1;
      const fall = phase * 82;
      const sway = Math.sin((phase + i) * Math.PI * 2) * 2.5;
      const op = rainWindow * (0.25 + 0.75 * (1 - Math.abs(phase - 0.5) * 1.2));
      rainDrops[i].setAttribute("transform", `translate(${(baseX + sway).toFixed(3)} ${fall.toFixed(3)})`);
      rainDrops[i].setAttribute("opacity", clamp(op, 0, 1).toFixed(3));
    }

    /* Beat 3: sprout grows taller, then bud opens */
    const growP = easeOutBack((t - 3.95) / 1.35);
    const settle = t > 5.05 ? Math.sin((t - 5.05) * 12) * Math.exp(-(t - 5.05) * 3.3) * 0.035 : 0;
    const sy = 1 + 0.62 * growP + settle;
    const sx = 1 - 0.07 * growP;
    const plantRot = growP > 0 ? Math.sin((t - 4.05) * 5.5) * (1 - clamp((t - 4.05) / 1.8, 0, 1)) * 2.4 : 0;
    if (t <= 0) {
      plant.setAttribute("transform", "");
    } else {
      plant.setAttribute(
        "transform",
        `translate(256.6 450.1) rotate(${plantRot.toFixed(3)}) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(-256.6 -450.1)`
      );
    }

    const openP = easeOutCubic((t - 4.75) / 0.95);
    const petalScale = 0.15 + 0.85 * openP;
    petals.setAttribute("opacity", openP <= 0 ? "0" : openP.toFixed(3));
    petals.setAttribute(
      "transform",
      `translate(256 404) scale(${petalScale.toFixed(3)} ${petalScale.toFixed(3)}) rotate(${(-8 + 8 * openP).toFixed(3)}) translate(-256 -404)`
    );

    /* Bud gives a tiny pop as petals appear */
    const budPop = openP > 0 ? 1 + Math.sin(openP * Math.PI) * 0.12 : 1;
    bud.setAttribute(
      "transform",
      budPop === 1 ? "" : `translate(256 404) scale(${budPop.toFixed(3)} ${budPop.toFixed(3)}) translate(-256 -404)`
    );

    /* Keep first frame exactly the supplied drawing */
    if (t === 0) {
      cloud.setAttribute("transform", "");
      cloudMask.setAttribute("opacity", "0");
      sun.setAttribute("opacity", "1");
      rain.setAttribute("opacity", "0");
      for (let i = 0; i < rainDrops.length; i++) {
        rainDrops[i].setAttribute("transform", "");
        rainDrops[i].setAttribute("opacity", "1");
      }
      plant.setAttribute("transform", "");
      bud.setAttribute("transform", "");
      petals.setAttribute("opacity", "0");
      petals.setAttribute("transform", "");
      dim.setAttribute("opacity", "0");
    }
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 6.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

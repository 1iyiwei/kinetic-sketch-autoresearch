<script>
(function () {
  const DURATION = 4.0;

  const body = document.getElementById("body");
  const rearWheel = document.getElementById("rearWheel");
  const frontWheel = document.getElementById("frontWheel");
  const speedLines = document.getElementById("speedLines");

  const rearCx = 180.2, rearCy = 342.0;
  const frontCx = 336.0, frontCy = 342.0;
  const wheelRadius = 30.8;

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function easeInQuad(u) {
    return u * u;
  }

  window.ksaRender = function (t) {
    t = Math.max(0, Math.min(DURATION, t));
    const u = clamp01(t / DURATION);

    if (t === 0) {
      body.removeAttribute("transform");
      rearWheel.removeAttribute("transform");
      frontWheel.removeAttribute("transform");
      speedLines.setAttribute("opacity", "0");
      speedLines.removeAttribute("transform");
      return;
    }

    // The car accelerates smoothly, then keeps enough momentum to leave the frame.
    const p = 0.82 * u + 0.18 * easeInQuad(u);
    const x = 650 * p;

    // Rolling distance maps directly to wheel rotation.
    const angle = (x / wheelRadius) * 180 / Math.PI;

    // A light hand-drawn body bob. It starts at zero so the anchor frame is untouched.
    const bobEnvelope = Math.min(1, u * 4);
    const bob = -2.8 * Math.sin(x / 18.5) * bobEnvelope;
    const pitch = 0.55 * Math.sin(x / 42) * bobEnvelope;

    body.setAttribute(
      "transform",
      "translate(" + x.toFixed(3) + " " + bob.toFixed(3) + ") rotate(" + pitch.toFixed(3) + " 256 306)"
    );

    rearWheel.setAttribute(
      "transform",
      "translate(" + x.toFixed(3) + " 0) rotate(" + angle.toFixed(3) + " " + rearCx + " " + rearCy + ")"
    );

    frontWheel.setAttribute(
      "transform",
      "translate(" + x.toFixed(3) + " 0) rotate(" + angle.toFixed(3) + " " + frontCx + " " + frontCy + ")"
    );

    // Brief sketchy speed streaks left behind the accelerating car.
    const lineFadeIn = clamp01((u - 0.10) / 0.15);
    const lineFadeOut = 1 - clamp01((u - 0.78) / 0.18);
    const lineOpacity = 0.75 * lineFadeIn * lineFadeOut;
    const lineX = Math.max(0, x - 70);
    const jitter = Math.sin(t * 18) * 2.0;

    speedLines.setAttribute("opacity", lineOpacity.toFixed(3));
    speedLines.setAttribute(
      "transform",
      "translate(" + lineX.toFixed(3) + " " + jitter.toFixed(3) + ")"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

<script>
(function () {
  const DURATION = 4.0;

  const car = document.getElementById('car');
  const body = document.getElementById('body');
  const frontWheel = document.getElementById('frontWheel');
  const rearWheel = document.getElementById('rearWheel');
  const fx = document.getElementById('fx');

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  /*
    Revised timing:
    - The car now uses the whole 4 second shot, with the rear only clearing the frame near the end.
    - Wheel rotation is directly derived from traveled distance / wheel radius.
    - A stronger suspension bob and a small delayed body pitch make the ride read more clearly.
  */
  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    // Anchor frame: must be exactly the original drawing.
    if (t === 0) {
      car.removeAttribute('transform');
      body.removeAttribute('transform');
      frontWheel.removeAttribute('transform');
      rearWheel.removeAttribute('transform');
      fx.setAttribute('opacity', '0');
      fx.removeAttribute('transform');
      return;
    }

    const u = t / DURATION;

    // Brief acceleration, then nearly constant cruise.
    // At t=4 the car has just driven fully beyond the right edge.
    const accelTime = 0.62;
    const accel = smoothstep(t / accelTime);
    const cruiseDistance = 426; // leftmost car point passes x=512 right near the end
    const distance = cruiseDistance * (0.90 * u + 0.10 * accel);
    const x = distance;

    // More visible cartoon suspension, tied to road travel.
    const bob =
      Math.sin(x / 19.5) * 3.15 +
      Math.sin(x / 42.0 + 0.7) * 0.95;

    // Small body-only follow-through tilt, phase-delayed against the vertical bob.
    const tilt =
      Math.sin(x / 29.0 - 0.75) * 1.45 +
      Math.sin(x / 63.0) * 0.35;

    // Wheel rotation: angle = distance / radius.
    // Radius inferred from wheel drawing, about 30 px.
    const radius = 30.0;
    const angle = (x / radius) * 180 / Math.PI;

    car.setAttribute('transform', `translate(${x.toFixed(3)} ${bob.toFixed(3)})`);

    // Rotate body around its approximate mass center; wheels remain rolling underneath.
    body.setAttribute(
      'transform',
      `rotate(${tilt.toFixed(3)} 256 318) translate(0 ${(Math.sin(x / 23.0 + 0.9) * 0.55).toFixed(3)})`
    );

    // Centers inferred from the original wheel geometry.
    frontWheel.setAttribute('transform', `rotate(${angle.toFixed(3)} 180.3 342.0)`);
    rearWheel.setAttribute('transform', `rotate(${angle.toFixed(3)} 336.1 342.0)`);

    // Dust/speed marks trail behind the car. They fade in after the exact anchor and fade away
    // as the car clears the shot, avoiding a long empty tail.
    const fadeIn = smoothstep(t / 0.45);
    const fadeOut = 1 - smoothstep((t - 3.55) / 0.45);
    const pulse = 0.58 + 0.42 * Math.sin(t * 13.0) * Math.sin(t * 13.0);
    const op = clamp(fadeIn * fadeOut * pulse, 0, 0.72);

    fx.setAttribute('opacity', op.toFixed(3));
    fx.setAttribute(
      'transform',
      `translate(${(x - 70 - Math.sin(t * 16.0) * 6.0).toFixed(3)} ${(bob + Math.sin(t * 10.0) * 1.0).toFixed(3)})`
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 512px;
      height: 512px;
      background: #f1f3f5;
      overflow: hidden;
    }
    svg {
      display: block;
      width: 512px;
      height: 512px;
    }
  </style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="boltRevealClip">
      <rect id="boltRevealRect" x="190" y="230" width="140" height="220"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#f1f3f5"/>

  <g id="cloudGroup">
    <path id="p1" d="M150 250 C 120 250, 110 200, 150 190 C 150 140, 220 130, 240 170 C 270 130, 350 150, 340 200 C 390 200, 390 250, 350 250 Z" fill="#868e96"/>
  </g>

  <g id="flashGroup" opacity="0">
    <circle id="flashCore" cx="256" cy="245" r="20" fill="#fff9db"/>
    <path id="flashRay1" d="M256 222 L256 192" stroke="#fff3bf" stroke-width="7" stroke-linecap="round"/>
    <path id="flashRay2" d="M285 235 L318 218" stroke="#fff3bf" stroke-width="7" stroke-linecap="round"/>
    <path id="flashRay3" d="M228 236 L196 218" stroke="#fff3bf" stroke-width="7" stroke-linecap="round"/>
    <path id="flashRay4" d="M274 263 L296 288" stroke="#fff3bf" stroke-width="7" stroke-linecap="round"/>
    <path id="flashRay5" d="M237 263 L215 288" stroke="#fff3bf" stroke-width="7" stroke-linecap="round"/>
  </g>

  <g id="boltGroup" clip-path="url(#boltRevealClip)">
    <polygon id="p2" points="250,240 200,350 245,350 220,440 310,320 262,320 290,240" fill="#fcc419"/>
  </g>

  <g id="sparkGroup" opacity="0">
    <path d="M184 342 L158 351" stroke="#fcc419" stroke-width="5" stroke-linecap="round"/>
    <path d="M316 324 L344 316" stroke="#fcc419" stroke-width="5" stroke-linecap="round"/>
    <path d="M218 454 L205 482" stroke="#fcc419" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const cloudGroup = document.getElementById("cloudGroup");
  const boltGroup = document.getElementById("boltGroup");
  const p1 = document.getElementById("p1");
  const p2 = document.getElementById("p2");
  const clipRect = document.getElementById("boltRevealRect");
  const flashGroup = document.getElementById("flashGroup");
  const flashCore = document.getElementById("flashCore");
  const sparkGroup = document.getElementById("sparkGroup");

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function lerp(a, b, u) {
    return a + (b - a) * u;
  }

  function smooth(u) {
    u = clamp(u, 0, 1);
    return u * u * (3 - 2 * u);
  }

  function easeOutCubic(u) {
    u = clamp(u, 0, 1);
    return 1 - Math.pow(1 - u, 3);
  }

  function easeInCubic(u) {
    u = clamp(u, 0, 1);
    return u * u * u;
  }

  function backOut(u) {
    u = clamp(u, 0, 1);
    const c1 = 1.55;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2);
  }

  function bounceSettle(local) {
    local = clamp(local, 0, 1);
    return Math.sin(local * Math.PI * 3.2) * Math.pow(1 - local, 2);
  }

  function setAttrs(el, attrs) {
    for (const k in attrs) el.setAttribute(k, attrs[k]);
  }

  window.ksaRender = function(t) {
    t = clamp(t, 0, DURATION);

    // Reset exact base styling every frame.
    p1.setAttribute("fill", "#868e96");
    p2.setAttribute("fill", "#fcc419");

    // --- Cloud drift-in with soft overshoot and settle ---
    // Final cloud is exactly untransformed at t=4.
    let cloudOpacity = 1;
    let cloudTransform = "";

    if (t < 0.15) {
      cloudOpacity = 0;
      cloudTransform = "translate(-95 0)";
    } else if (t < 1.45) {
      const u = (t - 0.15) / 1.30;
      const e = backOut(u);
      const x = lerp(-95, 0, e);
      const y = Math.sin(u * Math.PI) * -7;
      const s = lerp(0.96, 1.0, smooth(u));
      cloudOpacity = smooth(u);
      cloudTransform =
        "translate(" + x.toFixed(3) + " " + y.toFixed(3) + ") " +
        "translate(256 210) scale(" + s.toFixed(4) + " " + (1 / s).toFixed(4) + ") translate(-256 -210)";
    } else if (t < 2.35) {
      const u = (t - 1.45) / 0.90;
      const wob = Math.sin(u * Math.PI * 2.4) * Math.pow(1 - u, 2);
      const x = wob * 4.5;
      const y = -Math.abs(wob) * 1.5;
      cloudTransform = "translate(" + x.toFixed(3) + " " + y.toFixed(3) + ")";
      cloudOpacity = 1;
    } else {
      cloudTransform = "";
      cloudOpacity = 1;
    }

    cloudGroup.setAttribute("transform", cloudTransform);
    cloudGroup.setAttribute("opacity", cloudOpacity.toFixed(3));

    // --- Lightning bolt strike: reveal downward, flash, then rebound settle ---
    let boltOpacity = 1;
    let boltTransform = "";
    let clipY = 230;
    let clipH = 220;

    if (t < 1.05) {
      boltOpacity = 0;
      clipY = 230;
      clipH = 0;
      boltTransform = "translate(0 -18)";
    } else if (t < 1.32) {
      // Tiny charged pre-emergence above the cloud.
      const u = (t - 1.05) / 0.27;
      boltOpacity = smooth(u) * 0.35;
      clipY = 235;
      clipH = 25 * smooth(u);
      const sx = lerp(0.65, 0.85, smooth(u));
      const sy = lerp(0.20, 0.42, smooth(u));
      boltTransform =
        "translate(255 240) scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(-255 -240)";
    } else if (t < 1.78) {
      // Main strike draws down from the cloud with a fast snap.
      const u = (t - 1.32) / 0.46;
      const e = easeInCubic(u);
      boltOpacity = 1;
      clipY = 240;
      clipH = lerp(0, 205, e);
      const drop = lerp(-28, 0, easeOutCubic(u));
      const sx = lerp(0.78, 1.06, easeOutCubic(u));
      const sy = lerp(0.92, 1.03, easeOutCubic(u));
      boltTransform =
        "translate(255 240) translate(0 " + drop.toFixed(3) + ") " +
        "scale(" + sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(-255 -240)";
    } else if (t < 2.55) {
      // Cartoon elastic settle around the top contact point.
      const u = (t - 1.78) / 0.77;
      const b = bounceSettle(u);
      boltOpacity = 1;
      clipY = 230;
      clipH = 220;
      const rot = b * -4.2;
      const sx = 1 + b * 0.045;
      const sy = 1 - b * 0.035;
      boltTransform =
        "translate(255 240) rotate(" + rot.toFixed(3) + ") scale(" +
        sx.toFixed(4) + " " + sy.toFixed(4) + ") translate(-255 -240)";
    } else {
      boltOpacity = 1;
      clipY = 230;
      clipH = 220;
      boltTransform = "";
    }

    boltGroup.setAttribute("opacity", boltOpacity.toFixed(3));
    boltGroup.setAttribute("transform", boltTransform);
    setAttrs(clipRect, {
      x: 190,
      y: clipY.toFixed(3),
      width: 140,
      height: clipH.toFixed(3)
    });

    // --- Flash at contact point, fully gone before final anchor ---
    let flashOpacity = 0;
    let flashScale = 1;

    if (t >= 1.38 && t < 1.95) {
      const u = (t - 1.38) / 0.57;
      flashOpacity = Math.sin(u * Math.PI) * 0.95;
      flashScale = lerp(0.55, 1.65, easeOutCubic(u));
    } else if (t >= 1.95 && t < 2.20) {
      const u = (t - 1.95) / 0.25;
      flashOpacity = (1 - u) * 0.18;
      flashScale = lerp(1.4, 2.0, u);
    }

    flashGroup.setAttribute("opacity", flashOpacity.toFixed(3));
    flashGroup.setAttribute(
      "transform",
      "translate(256 245) scale(" + flashScale.toFixed(4) + ") translate(-256 -245)"
    );
    flashCore.setAttribute("r", (20 + flashScale * 4).toFixed(3));

    // --- Small strike accents, attached to the bolt, hidden at final ---
    let sparkOpacity = 0;
    let sparkScale = 1;

    if (t >= 1.70 && t < 2.35) {
      const u = (t - 1.70) / 0.65;
      sparkOpacity = Math.sin(u * Math.PI) * 0.85;
      sparkScale = lerp(0.75, 1.25, easeOutCubic(u));
    }

    sparkGroup.setAttribute("opacity", sparkOpacity.toFixed(3));
    sparkGroup.setAttribute(
      "transform",
      "translate(256 360) scale(" + sparkScale.toFixed(4) + ") translate(-256 -360)"
    );

    // Hard guarantee: final frame is visually identical to the supplied SVG.
    if (Math.abs(t - DURATION) < 1e-9) {
      cloudGroup.removeAttribute("transform");
      cloudGroup.setAttribute("opacity", "1");
      boltGroup.removeAttribute("transform");
      boltGroup.setAttribute("opacity", "1");
      setAttrs(clipRect, { x: 190, y: 230, width: 140, height: 220 });
      flashGroup.setAttribute("opacity", "0");
      sparkGroup.setAttribute("opacity", "0");
      p1.setAttribute("fill", "#868e96");
      p2.setAttribute("fill", "#fcc419");
    }
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

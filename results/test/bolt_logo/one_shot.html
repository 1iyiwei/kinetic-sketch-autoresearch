<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Cloud Lightning Logo Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }
    #stage {
      width: 512px;
      height: 512px;
      display: block;
    }
  </style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="boltClip">
      <rect id="boltClipRect" x="190" y="240" width="140" height="210"/>
    </clipPath>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#f1f3f5"/>

  <g id="flashLayer" opacity="0">
    <circle id="flashCircle" cx="256" cy="250" r="90" fill="#ffffff" opacity="0.85"/>
    <path id="flashRay1" d="M256 150 L256 95" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path id="flashRay2" d="M330 205 L380 175" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path id="flashRay3" d="M180 205 L130 175" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g id="cloudGroup">
    <path id="p1" d="M150 250 C 120 250, 110 200, 150 190 C 150 140, 220 130, 240 170 C 270 130, 350 150, 340 200 C 390 200, 390 250, 350 250 Z" fill="#868e96"/>
  </g>

  <g id="boltGroup">
    <polygon id="p2" points="250,240 200,350 245,350 220,440 310,320 262,320 290,240" fill="#fcc419"/>
  </g>

  <g id="motionLines" opacity="0">
    <path id="ml1" d="M112 215 C 92 215, 77 215, 58 215" fill="none" stroke="#868e96" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
    <path id="ml2" d="M125 238 C 101 238, 86 238, 68 238" fill="none" stroke="#868e96" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
    <path id="ml3" d="M244 462 C 238 478, 226 488, 210 493" fill="none" stroke="#fcc419" stroke-width="6" stroke-linecap="round" opacity="0.55"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const cloudGroup = document.getElementById("cloudGroup");
  const boltGroup = document.getElementById("boltGroup");
  const p1 = document.getElementById("p1");
  const p2 = document.getElementById("p2");
  const clipRect = document.getElementById("boltClipRect");
  const flashLayer = document.getElementById("flashLayer");
  const flashCircle = document.getElementById("flashCircle");
  const motionLines = document.getElementById("motionLines");
  const ml1 = document.getElementById("ml1");
  const ml2 = document.getElementById("ml2");
  const ml3 = document.getElementById("ml3");

  function clamp(x, a, b) {
    return Math.max(a, Math.min(b, x));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function easeOutCubic(x) {
    x = clamp(x, 0, 1);
    return 1 - Math.pow(1 - x, 3);
  }

  function easeOutBack(x) {
    x = clamp(x, 0, 1);
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
  }

  function easeInCubic(x) {
    x = clamp(x, 0, 1);
    return x * x * x;
  }

  function setFinalFrame() {
    cloudGroup.setAttribute("transform", "");
    cloudGroup.setAttribute("opacity", "1");
    boltGroup.setAttribute("transform", "");
    boltGroup.removeAttribute("clip-path");
    boltGroup.setAttribute("opacity", "1");
    p1.setAttribute("fill", "#868e96");
    p2.setAttribute("fill", "#fcc419");
    flashLayer.setAttribute("opacity", "0");
    motionLines.setAttribute("opacity", "0");
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    if (t >= DURATION) {
      setFinalFrame();
      return;
    }

    /* Cloud drift-in: arrives from the left, overshoots, then settles. */
    const cloudIn = easeOutBack((t - 0.15) / 1.65);
    const cloudFade = smoothstep((t - 0.05) / 0.85);
    let cx = -185 * (1 - cloudIn);
    let cy = -9 * Math.sin(clamp((t - 0.15) / 1.65, 0, 1) * Math.PI) * (1 - cloudIn * 0.25);

    /* Impact tremble after bolt strike, decaying into the final logo. */
    let shakeX = 0;
    let shakeY = 0;
    let scaleX = 1;
    let scaleY = 1;
    if (t > 1.85 && t < 3.15) {
      const s = (t - 1.85) / 1.3;
      const decay = Math.pow(1 - clamp(s, 0, 1), 2.2);
      shakeX = Math.sin(s * 44) * 5.0 * decay;
      shakeY = Math.cos(s * 37) * 2.2 * decay;
      scaleX = 1 + Math.sin(s * 24) * 0.018 * decay;
      scaleY = 1 - Math.sin(s * 24) * 0.012 * decay;
    }

    cloudGroup.setAttribute(
      "transform",
      "translate(" + (cx + shakeX).toFixed(3) + " " + (cy + shakeY).toFixed(3) + ") " +
      "translate(256 220) scale(" + scaleX.toFixed(4) + " " + scaleY.toFixed(4) + ") translate(-256 -220)"
    );
    cloudGroup.setAttribute("opacity", cloudFade.toFixed(3));

    /* Motion streaks for cloud entrance. */
    const lineOpacity = Math.max(0, Math.sin(clamp((t - 0.12) / 1.1, 0, 1) * Math.PI)) * 0.75;
    motionLines.setAttribute("opacity", lineOpacity.toFixed(3));
    ml1.setAttribute("transform", "translate(" + (cx * 0.35).toFixed(2) + " 0)");
    ml2.setAttribute("transform", "translate(" + (cx * 0.28).toFixed(2) + " 0)");

    /* Bolt reveal: a quick vertical strike from cloud to point. */
    const strike = easeInCubic((t - 1.28) / 0.48);
    const settle = easeOutCubic((t - 1.75) / 1.05);
    const boltVisible = t > 1.18 ? 1 : 0;

    if (strike < 1 || t < 2.9) {
      boltGroup.setAttribute("clip-path", "url(#boltClip)");
      const revealHeight = 210 * clamp(strike, 0, 1);
      clipRect.setAttribute("y", "240");
      clipRect.setAttribute("height", revealHeight.toFixed(3));
    } else {
      boltGroup.removeAttribute("clip-path");
    }

    let boltOpacity = boltVisible ? smoothstep((t - 1.18) / 0.16) : 0;
    boltGroup.setAttribute("opacity", boltOpacity.toFixed(3));

    let bx = 0;
    let by = -120 * (1 - strike);
    let rot = -7 * (1 - strike);
    let bsx = 1;
    let bsy = 1;

    if (t > 1.75) {
      const d = clamp((t - 1.75) / 1.2, 0, 1);
      const amp = Math.pow(1 - d, 2.5);
      by = Math.sin(d * Math.PI * 5) * 9 * amp;
      bx = Math.sin(d * Math.PI * 6) * 4 * amp;
      rot = Math.sin(d * Math.PI * 4) * 4 * amp;
      bsx = 1 + 0.045 * Math.sin(d * Math.PI * 3) * amp;
      bsy = 1 - 0.035 * Math.sin(d * Math.PI * 3) * amp;
    }

    if (t > 3.25) {
      const finalSettle = smoothstep((t - 3.25) / 0.65);
      bx *= (1 - finalSettle);
      by *= (1 - finalSettle);
      rot *= (1 - finalSettle);
      bsx = 1 + (bsx - 1) * (1 - finalSettle);
      bsy = 1 + (bsy - 1) * (1 - finalSettle);
    }

    boltGroup.setAttribute(
      "transform",
      "translate(" + (bx + shakeX * 0.35).toFixed(3) + " " + by.toFixed(3) + ") " +
      "translate(255 340) rotate(" + rot.toFixed(3) + ") scale(" + bsx.toFixed(4) + " " + bsy.toFixed(4) + ") translate(-255 -340)"
    );

    /* Flash at the moment of contact. */
    const flashA = Math.max(0, 1 - Math.abs(t - 1.78) / 0.22);
    const flashB = Math.max(0, 1 - Math.abs(t - 2.05) / 0.18) * 0.35;
    const flash = Math.max(flashA, flashB);
    flashLayer.setAttribute("opacity", flash.toFixed(3));
    flashCircle.setAttribute("r", (55 + 80 * (1 - flash)).toFixed(2));
    flashLayer.setAttribute("transform", "scale(" + (1 + flash * 0.025).toFixed(4) + ")");

    /* Small yellow follow-through streak near the bolt tip, gone before final. */
    const tipLine = Math.max(0, Math.sin(clamp((t - 1.78) / 0.65, 0, 1) * Math.PI)) * 0.65;
    ml3.setAttribute("opacity", tipLine.toFixed(3));
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

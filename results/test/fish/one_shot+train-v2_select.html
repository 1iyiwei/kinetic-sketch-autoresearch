    <path id="ml2" d="M414 258 C433 257 447 258 461 261" stroke-width="2.5"/>
    <path id="ml3" d="M405 285 C424 288 438 290 452 294" stroke-width="2.5"/>

<script>
(function () {
  const DURATION = 4.0;

  const fish = document.getElementById("fish");
  const bodyParts = document.getElementById("bodyParts");
  const tail = document.getElementById("tail");
  const s5 = document.getElementById("s5");
  const s6 = document.getElementById("s6");
  const motionLines = document.getElementById("motionLines");

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    if (t === 0) {
      fish.removeAttribute("transform");
      bodyParts.removeAttribute("transform");
      tail.removeAttribute("transform");
      s5.removeAttribute("transform");
      s6.removeAttribute("transform");
      s5.setAttribute("opacity", "1");
      s6.setAttribute("opacity", "1");
      motionLines.setAttribute("opacity", "0");
      motionLines.removeAttribute("transform");
      return;
    }

    const p = t / DURATION;
    const ramp = smoothstep(clamp(t / 0.45, 0, 1));

    // Whole fish swims left with a gentle upward/downward arc.
    const swimEase = 1 - Math.pow(1 - p, 1.18);
    const x = -164 * swimEase;
    const y = ramp * (5.5 * Math.sin(Math.PI * 2 * 1.15 * t) - 3.5 * p);
    const bodyAngle = ramp * (1.8 * Math.sin(Math.PI * 2 * 1.15 * t + 0.35));

    fish.setAttribute(
      "transform",
      "translate(" + x.toFixed(3) + " " + y.toFixed(3) + ") rotate(" + bodyAngle.toFixed(3) + " 255 256)"
    );

    // Small counter-sway in the body: a cartoon swimming shimmy.
    const bodyShimmy = ramp * (1.2 * Math.sin(Math.PI * 2 * 2.3 * t + Math.PI));
    bodyParts.setAttribute("transform", "rotate(" + bodyShimmy.toFixed(3) + " 255 256)");

    // Tail wags around its contact point with the body.
    const tailAngle =
      ramp *
      (
        13.5 * Math.sin(Math.PI * 2 * 3.15 * t) +
        2.5 * Math.sin(Math.PI * 2 * 6.3 * t)
      );
    tail.setAttribute("transform", "rotate(" + tailAngle.toFixed(3) + " 316 256)");

    // Bubbles drift upward and wiggle slightly. At t=0 they are exactly in the source positions.
    const b1Rise = -84 * smoothstep(p);
    const b1X = ramp * (7 * Math.sin(Math.PI * 2 * 0.7 * t));
    const b1Scale = 1 + 0.06 * ramp * Math.sin(Math.PI * 2 * 1.1 * t);
    s5.setAttribute(
      "transform",
      "translate(" + b1X.toFixed(3) + " " + b1Rise.toFixed(3) + ") scale(" + b1Scale.toFixed(4) + " " + (1 / b1Scale).toFixed(4) + ")"
    );
    s5.setAttribute("opacity", String(1 - 0.18 * smoothstep((p - 0.65) / 0.35)));

    const b2Rise = -122 * smoothstep(p);
    const b2X = ramp * (9 * Math.sin(Math.PI * 2 * 0.62 * t + 0.55));
    const b2Scale = 1 + 0.07 * ramp * Math.sin(Math.PI * 2 * 1.25 * t + 1.2);
    s6.setAttribute(
      "transform",
      "translate(" + b2X.toFixed(3) + " " + b2Rise.toFixed(3) + ") scale(" + b2Scale.toFixed(4) + " " + (1 / b2Scale).toFixed(4) + ")"
    );
    s6.setAttribute("opacity", String(1 - 0.25 * smoothstep((p - 0.55) / 0.45)));

    // Subtle motion strokes trail behind the tail as the fish gains speed.
    const mlOpacity = 0.28 * smoothstep(p / 0.25) * (1 - 0.25 * p);
    const mlX = x + 6 * Math.sin(Math.PI * 2 * 2.1 * t);
    motionLines.setAttribute("opacity", mlOpacity.toFixed(3));
    motionLines.setAttribute("transform", "translate(" + mlX.toFixed(3) + " " + y.toFixed(3) + ")");
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

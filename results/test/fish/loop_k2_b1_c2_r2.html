<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Revised Fish Swim Animation</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 512px;
      height: 512px;
      overflow: hidden;
      background: #ffffff;
    }
    svg {
      display: block;
      width: 512px;
      height: 512px;
      background: #ffffff;
    }
  </style>
</head>
<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>

  <!-- Added water/speed strokes. They are invisible at t=0 so the anchor frame matches exactly. -->
  <g id="motionLines" opacity="0">
    <path id="m1" d="M410 235 C428 232 445 233 463 236" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round"/>
    <path id="m2" d="M416 257 C435 260 450 260 468 257" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/>
    <path id="m3" d="M408 283 C425 288 441 289 458 286" fill="none" stroke="#1d1d1f" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <g id="fish">
    <g id="fishBody">
      <path id="s1" d="M125.2,225.5 L130.3,220.4 L135.5,216.3 L142.1,212.5 L149.3,209.1 L156.8,206.1 L165.6,202.8 L174.4,200.4 L183.0,198.3 L192.9,196.2 L202.9,195.3 L213.0,194.3 L222.0,194.6 L232.2,194.7 L241.2,195.0 L250.9,196.1 L260.7,198.1 L269.1,200.5 L277.4,203.8 L286.1,206.8 L293.8,210.4 L301.1,214.8 L306.6,218.5 L312.4,222.6 L317.4,226.6 L322.1,231.7 L324.8,237.1 L327.1,242.0 L328.8,246.9 L329.3,253.1 L329.7,257.9 L329.3,262.9 L327.3,269.2 L324.9,274.3 L321.3,279.4 L316.6,285.2 L311.1,289.8 L306.0,294.2 L300.4,298.0 L294.1,302.5 L286.6,306.5 L278.2,309.9 L270.0,312.4 L260.8,314.7 L251.3,315.7 L242.1,316.6 L232.3,317.9 L221.9,317.5 L211.6,317.6 L201.9,316.7 L192.4,316.3 L182.8,314.5 L174.4,312.6 L165.4,310.1 L157.2,306.6 L149.3,303.1 L142.6,299.3 L136.2,296.1 L130.8,291.5 L125.6,286.6" fill="none" stroke="#1d1d1f" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="s3" d="M169.0,235.4 L168.8,239.2 L167.2,242.8 L164.1,246.3 L160.5,247.6 L156.9,247.1 L154.0,244.5 L152.1,241.7 L151.2,237.6 L152.4,233.1 L154.7,230.7 L158.2,229.7 L161.8,230.0 L164.7,232.2 L167.5,235.2 L168.1,239.9" fill="none" stroke="#1d1d1f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path id="s4" d="M269.7,216.1 L273.8,219.4 L276.7,222.8 L279.3,225.7 L282.9,229.1 L285.8,233.9 L287.8,238.9 L289.3,243.3 L290.0,247.9 L290.9,253.4 L291.1,258.1 L290.5,262.9 L289.8,268.3 L288.8,273.4 L286.8,278.4 L283.6,282.7 L280.1,286.4 L276.5,290.7 L272.5,294.3 L269.7,296.8" fill="none" stroke="#1d1d1f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="tail">
      <path id="s2" d="M315.9,228.0 L322.8,225.7 L328.9,221.9 L335.3,218.4 L341.1,216.1 L347.1,213.5 L353.6,211.2 L360.8,207.5 L366.9,205.2 L373.7,202.1 L380.7,199.5 L387.1,196.4 L393.0,193.2 L399.0,190.4 L398.2,194.9 L397.2,199.4 L395.5,204.8 L394.4,210.6 L393.5,215.9 L391.8,221.3 L390.1,226.4 L389.7,231.9 L389.2,236.7 L388.2,242.0 L386.3,247.4 L385.7,252.1 L384.8,256.9 L385.5,262.1 L386.1,267.4 L388.1,271.9 L389.9,276.3 L391.4,281.0 L393.1,286.1 L394.6,290.6 L394.8,296.3 L396.0,301.5 L396.4,306.1 L397.4,310.7 L399.4,316.4 L401.2,321.9 L394.2,318.4 L388.0,315.0 L381.4,312.3 L374.8,308.9 L367.6,306.3 L360.5,303.6 L353.6,300.6 L346.9,297.9 L340.6,294.7 L334.0,292.1 L328.4,289.2 L321.5,286.1 L314.9,283.5" fill="none" stroke="#1d1d1f" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="bubbles">
    <path id="s5" d="M140.5,329.4 L139.0,332.8 L136.0,335.7 L133.0,337.6 L129.0,338.1 L124.5,337.0 L121.1,335.3 L119.4,331.7 L119.6,327.8 L121.4,323.7 L124.1,321.6 L127.8,320.2 L132.6,320.7 L136.9,323.2 L139.4,325.9 L140.3,329.9" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="s6" d="M117.5,370.0 L116.9,373.7 L114.5,376.6 L111.8,377.2 L108.9,377.2 L106.4,375.0 L104.1,371.4 L103.8,368.6 L105.0,364.9 L107.4,362.5 L111.0,362.7 L114.7,363.3 L116.6,365.5 L117.9,369.5" fill="none" stroke="#1d1d1f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const fish = document.getElementById("fish");
  const fishBody = document.getElementById("fishBody");
  const tail = document.getElementById("tail");
  const s5 = document.getElementById("s5");
  const s6 = document.getElementById("s6");
  const motionLines = document.getElementById("motionLines");

  function clamp(v, a, b) {
    return Math.max(a, Math.min(b, v));
  }

  function smoothstep(x) {
    x = clamp(x, 0, 1);
    return x * x * (3 - 2 * x);
  }

  function fmt(v) {
    return Number(v).toFixed(3);
  }

  window.ksaRender = function (t) {
    t = clamp(t, 0, DURATION);

    const p = t / DURATION;

    /*
      Anchor: at t=0 all transforms are identity and added lines have opacity 0,
      preserving the supplied drawing exactly.
    */
    const swimIn = smoothstep(t / 0.28);

    // Stronger leftward swim: the fish starts as drawn, then cleanly exits the left edge.
    // Final dx puts the entire fish, including tail, off-screen.
    const dx = -455 * p;
    const dy = swimIn * (6.5 * Math.sin(Math.PI * 2 * (0.72 * t)) +
                         2.2 * Math.sin(Math.PI * 2 * (1.45 * t)));

    // Small body roll / swimming arc, zero at the anchor frame.
    const bodyRoll = swimIn * 1.9 * Math.sin(Math.PI * 2 * 2.15 * t + Math.PI);

    fish.setAttribute(
      "transform",
      "translate(" + fmt(dx) + " " + fmt(dy) + ") rotate(" + fmt(bodyRoll) + " 255 256)"
    );

    // Clear rhythmic tail wag around the rear-body hinge.
    // The hinge is the tail/body contact at roughly (316,256), so the base stays connected.
    const wagFreq = 3.15;
    const wag = swimIn * 23 * Math.sin(Math.PI * 2 * wagFreq * t);
    const tailStretch = 1 + swimIn * 0.035 * Math.cos(Math.PI * 2 * wagFreq * t);

    tail.setAttribute(
      "transform",
      "translate(316 256) rotate(" + fmt(wag) + ") scale(" + tailStretch.toFixed(4) + " 1) translate(-316 -256)"
    );

    // Very slight counter-motion in the body, opposite the tail beat, without redrawing paths.
    const bodyCounter = swimIn * -2.1 * Math.sin(Math.PI * 2 * wagFreq * t);
    const bodySquash = 1 + swimIn * 0.007 * Math.cos(Math.PI * 2 * wagFreq * t + Math.PI);
    fishBody.setAttribute(
      "transform",
      "translate(316 256) rotate(" + fmt(bodyCounter) + ") translate(-316 -256) " +
      "translate(255 256) scale(" + bodySquash.toFixed(4) + " " + (1 / bodySquash).toFixed(4) + ") translate(-255 -256)"
    );

    // Bubbles are independent from the fish: steady upward drift with gentle horizontal wobble.
    // No wrapping is used, so they visibly rise through the water instead of following the body.
    const bEase = smoothstep(t / 0.35);

    const b5x = bEase * (15 * Math.sin(Math.PI * 2 * 0.38 * t) + 3 * Math.sin(Math.PI * 2 * 0.91 * t));
    const b5y = bEase * (-150 * p);
    const b5s = 1 + bEase * 0.055 * Math.sin(Math.PI * 2 * 0.72 * t);
    s5.setAttribute(
      "transform",
      "translate(" + fmt(b5x) + " " + fmt(b5y) + ") translate(130 329) scale(" + b5s.toFixed(4) + ") translate(-130 -329)"
    );

    const b6x = bEase * (18 * Math.sin(Math.PI * 2 * 0.33 * t + 0.75) + 2.5 * Math.sin(Math.PI * 2 * 0.8 * t));
    const b6y = bEase * (-205 * p);
    const b6s = 1 + bEase * 0.065 * Math.sin(Math.PI * 2 * 0.68 * t + 0.6);
    s6.setAttribute(
      "transform",
      "translate(" + fmt(b6x) + " " + fmt(b6y) + ") translate(111 370) scale(" + b6s.toFixed(4) + ") translate(-111 -370)"
    );

    // Continuous water/speed lines behind the tail: fade in smoothly and drift with the tail area,
    // with a soft sliding offset instead of popping on/off.
    const lineFade = smoothstep(t / 0.45) * smoothstep((DURATION - t) / 0.55);
    const lineOpacity = 0.18 * lineFade;
    const lineSlide = -18 * ((t * 1.45) % 1);
    const lineX = dx + lineSlide;
    const lineY = dy + 3 * Math.sin(Math.PI * 2 * 0.9 * t);

    motionLines.setAttribute("opacity", lineOpacity.toFixed(3));
    motionLines.setAttribute(
      "transform",
      "translate(" + fmt(lineX) + " " + fmt(lineY) + ")"
    );
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

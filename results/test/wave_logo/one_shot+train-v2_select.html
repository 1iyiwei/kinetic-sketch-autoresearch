<!DOCTYPE html>
<html>

    #stage {

      display: block;

<body>
<svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#ffffff"/>
  <g id="logo">
    <polyline id="p1" points="96,200.0 104,204.1 112,208.0 120,211.8 128,215.3 136,218.4 144,221.0 152,223.2 160,224.7 168,225.7 176,226.0 184,225.7 192,224.7 200,223.2 208,221.0 216,218.4 224,215.3 232,211.8 240,208.0 248,204.1 256,200.0 264,195.9 272,192.0 280,188.2 288,184.7 296,181.6 304,179.0 312,176.8 320,175.3 328,174.3 336,174.0 344,174.3 352,175.3 360,176.8 368,179.0 376,181.6 384,184.7 392,188.2 400,192.0 408,195.9 416,200.0" fill="none" stroke="#1c7ed6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline id="p2" points="96,256.0 104,260.1 112,264.0 120,267.8 128,271.3 136,274.4 144,277.0 152,279.2 160,280.7 168,281.7 176,282.0 184,281.7 192,280.7 200,279.2 208,277.0 216,274.4 224,271.3 232,267.8 240,264.0 248,260.1 256,256.0 264,251.9 272,248.0 280,244.2 288,240.7 296,237.6 304,235.0 312,232.8 320,231.3 328,230.3 336,230.0 344,230.3 352,231.3 360,232.8 368,235.0 376,237.6 384,240.7 392,244.2 400,248.0 408,251.9 416,256.0" fill="none" stroke="#339af0" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline id="p3" points="96,312.0 104,316.1 112,320.0 120,323.8 128,327.3 136,330.4 144,333.0 152,335.2 160,336.7 168,337.7 176,338.0 184,337.7 192,336.7 200,335.2 208,333.0 216,330.4 224,327.3 232,323.8 240,320.0 248,316.1 256,312.0 264,307.9 272,304.0 280,300.2 288,296.7 296,293.6 304,291.0 312,288.8 320,287.3 328,286.3 336,286.0 344,286.3 352,287.3 360,288.8 368,291.0 376,293.6 384,296.7 392,300.2 400,304.0 408,307.9 416,312.0" fill="none" stroke="#74c0fc" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<script>
(function () {
  const DURATION = 4.0;

  const originals = {
    p1: "96,200.0 104,204.1 112,208.0 120,211.8 128,215.3 136,218.4 144,221.0 152,223.2 160,224.7 168,225.7 176,226.0 184,225.7 192,224.7 200,223.2 208,221.0 216,218.4 224,215.3 232,211.8 240,208.0 248,204.1 256,200.0 264,195.9 272,192.0 280,188.2 288,184.7 296,181.6 304,179.0 312,176.8 320,175.3 328,174.3 336,174.0 344,174.3 352,175.3 360,176.8 368,179.0 376,181.6 384,184.7 392,188.2 400,192.0 408,195.9 416,200.0",
    p2: "96,256.0 104,260.1 112,264.0 120,267.8 128,271.3 136,274.4 144,277.0 152,279.2 160,280.7 168,281.7 176,282.0 184,281.7 192,280.7 200,279.2 208,277.0 216,274.4 224,271.3 232,267.8 240,264.0 248,260.1 256,256.0 264,251.9 272,248.0 280,244.2 288,240.7 296,237.6 304,235.0 312,232.8 320,231.3 328,230.3 336,230.0 344,230.3 352,231.3 360,232.8 368,235.0 376,237.6 384,240.7 392,244.2 400,248.0 408,251.9 416,256.0",
    p3: "96,312.0 104,316.1 112,320.0 120,323.8 128,327.3 136,330.4 144,333.0 152,335.2 160,336.7 168,337.7 176,338.0 184,337.7 192,336.7 200,335.2 208,333.0 216,330.4 224,327.3 232,323.8 240,320.0 248,316.1 256,312.0 264,307.9 272,304.0 280,300.2 288,296.7 296,293.6 304,291.0 312,288.8 320,287.3 328,286.3 336,286.0 344,286.3 352,287.3 360,287.3 368,291.0 376,293.6 384,296.7 392,300.2 400,304.0 408,307.9 416,312.0"
  };

  /* Correct p3 source verbatim: */
  originals.p3 = "96,312.0 104,316.1 112,320.0 120,323.8 128,327.3 136,330.4 144,333.0 152,335.2 160,336.7 168,337.7 176,338.0 184,337.7 192,336.7 200,335.2 208,333.0 216,330.4 224,327.3 232,323.8 240,320.0 248,316.1 256,312.0 264,307.9 272,304.0 280,300.2 288,296.7 296,293.6 304,291.0 312,288.8 320,287.3 328,286.3 336,286.0 344,286.3 352,287.3 360,288.8 368,291.0 376,293.6 384,296.7 392,300.2 400,304.0 408,307.9 416,312.0";

  const parsed = {};
  const ids = ["p1", "p2", "p3"];
  ids.forEach(id => {
    parsed[id] = originals[id].trim().split(/\s+/).map(pair => {
      const parts = pair.split(",");
      return { x: parseFloat(parts[0]), y: parseFloat(parts[1]) };
    });
  });

  const els = {};
  const lengths = {};
  ids.forEach(id => {
    els[id] = document.getElementById(id);
    lengths[id] = els[id].getTotalLength();
    els[id].style.strokeDasharray = lengths[id] + " " + lengths[id];
  });

  function clamp01(v) {
    return Math.max(0, Math.min(1, v));
  }

  function easeOutCubic(v) {
    v = clamp01(v);
    return 1 - Math.pow(1 - v, 3);
  }

  function easeInOutSine(v) {
    v = clamp01(v);
    return 0.5 - 0.5 * Math.cos(Math.PI * v);
  }

  function setDraw(id, p) {
    p = clamp01(p);
    els[id].style.strokeDashoffset = (lengths[id] * (1 - p)).toFixed(3);
    els[id].style.opacity = p <= 0.001 ? "0" : "1";
  }

  function ripplePoints(id, t) {
    const pts = parsed[id];
    const r = clamp01((t - 2.15) / 1.35);

    if (r <= 0 || r >= 1 || t >= DURATION) {
      return originals[id];
    }

    const rowLag = id === "p1" ? 0.00 : (id === "p2" ? 0.10 : 0.20);
    const rr = clamp01(r - rowLag * 0.25);
    const envelope = Math.sin(Math.PI * rr) * Math.pow(1 - rr, 0.65);
    const amp = 9.0 * envelope;

    return pts.map(pt => {
      const nx = (pt.x - 96) / 320;
      const wave = Math.sin((nx * 2.0 * Math.PI) - rr * 2.45 * Math.PI);
      const y = pt.y + amp * wave;
      return pt.x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
  }

  window.ksaRender = function (t) {
    t = Math.max(0, Math.min(DURATION, Number(t) || 0));

    const starts = { p1: 0.15, p2: 0.62, p3: 1.09 };
    const dur = 1.03;

    ids.forEach(id => {
      let raw = (t - starts[id]) / dur;
      let p = easeOutCubic(raw);

      /* A tiny overshoot-like finishing feel: the draw slows softly into the rounded cap. */
      if (raw > 0.82 && raw < 1.0) {
        p = 0.985 + 0.015 * easeInOutSine((raw - 0.82) / 0.18);
      }

      if (t >= DURATION) {
        els[id].setAttribute("points", originals[id]);
        setDraw(id, 1);
      } else {
        els[id].setAttribute("points", ripplePoints(id, t));
        setDraw(id, p);
      }
    });
  };

  window.ksaRender(0);
})();
</script>

<script>
/* ksa player: loops window.ksaRender(t) over the animation's duration, holding the last frame briefly.
   ?t=<seconds> freezes it at that time. Added by `ksa export`; not part of the generated program. */
(function () {
  var D = 4.0, HOLD = 0.8;
  var q = new URLSearchParams(location.search), fixed = q.get("t");
  var t0 = null;
  function tick(now) {
    if (t0 === null) t0 = now;
    var t = fixed !== null ? parseFloat(fixed) : ((now - t0) / 1000) % (D + HOLD);
    Promise.resolve(window.ksaRender(Math.min(t, D))).then(function () {
      if (fixed === null) requestAnimationFrame(tick);
    });
  }
  function start() { if (typeof window.ksaRender === "function") requestAnimationFrame(tick); }
  if (document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
</body>
</html>

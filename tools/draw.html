<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sketch Pad</title>
<style>
  :root { --bg: #f4f5f7; --panel: #fff; --fg: #1c2230; --muted: #5d6678; --line: #d9dde4; --accent: #2457c5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif;
         display: grid; place-items: start center; padding: 24px 16px; }
  main { display: grid; gap: 12px; width: min(560px, 100%); }
  h1 { font-size: 20px; margin: 0; }
  p { margin: 0; color: var(--muted); font-size: 13px; }
  canvas { width: 100%; aspect-ratio: 1; background: #fff; border: 1px solid var(--line); border-radius: 8px;
           touch-action: none; cursor: crosshair; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button, select { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line);
                   background: var(--panel); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw { width: 28px; height: 28px; border-radius: 50%; padding: 0; border: 2px solid transparent; }
  .sw[aria-pressed="true"] { border-color: var(--fg); }
  textarea { width: 100%; min-height: 64px; font: inherit; padding: 8px; border-radius: 6px; border: 1px solid var(--line); }
  code { font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Sketch Pad</h1>
  <p>Draw on the 512 × 512 canvas, describe the motion, then save. Each stroke becomes a path with an id
     (s1, s2, …). Animate the file with <code>uv run ksa animate drawing.svg</code>.</p>
  <canvas id="pad" width="512" height="512" aria-label="Drawing canvas"></canvas>
  <div class="row" id="tools">
    <span>Ink</span>
    <button class="sw" data-c="#1d1d1f" style="background:#1d1d1f" aria-pressed="true" aria-label="Black"></button>
    <button class="sw" data-c="#e8590c" style="background:#e8590c" aria-pressed="false" aria-label="Orange"></button>
    <button class="sw" data-c="#2457c5" style="background:#2457c5" aria-pressed="false" aria-label="Blue"></button>
    <button class="sw" data-c="#2b8a3e" style="background:#2b8a3e" aria-pressed="false" aria-label="Green"></button>
    <button class="sw" data-c="#c2255c" style="background:#c2255c" aria-pressed="false" aria-label="Pink"></button>
    <select id="width" aria-label="Stroke width"><option value="3">thin</option><option value="4" selected>medium</option><option value="7">thick</option></select>
    <button id="undo">Undo</button>
    <button id="clear">Clear</button>
  </div>
  <label for="intent">What should happen?</label>
  <textarea id="intent" placeholder="e.g. The ball rolls down the ramp and bounces on the floor."></textarea>
  <div class="row">
    <label for="name">File name</label>
    <input id="name" value="drawing" style="font:inherit;padding:6px;border:1px solid var(--line);border-radius:6px">
    <button class="primary" id="save">Save SVG</button>
  </div>
</main>
<script>
const pad = document.getElementById("pad"), ctx = pad.getContext("2d");
let strokes = [], cur = null, color = "#1d1d1f";
const widthSel = document.getElementById("width");

function pos(e) {
  const r = pad.getBoundingClientRect();
  return [(e.clientX - r.left) * 512 / r.width, (e.clientY - r.top) * 512 / r.height];
}
function draw() {
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 512, 512);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of strokes.concat(cur ? [cur] : [])) {
    ctx.strokeStyle = s.color; ctx.lineWidth = s.width; ctx.beginPath();
    s.pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y));
    if (s.pts.length === 1) ctx.lineTo(s.pts[0][0] + 0.1, s.pts[0][1]);
    ctx.stroke();
  }
}
pad.addEventListener("pointerdown", e => { pad.setPointerCapture(e.pointerId);
  cur = { color, width: +widthSel.value, pts: [pos(e)] }; draw(); });
pad.addEventListener("pointermove", e => { if (!cur) return; const p = pos(e), q = cur.pts[cur.pts.length - 1];
  if (Math.hypot(p[0] - q[0], p[1] - q[1]) > 2) { cur.pts.push(p); draw(); } });
const end = () => { if (cur) { strokes.push(cur); cur = null; draw(); } };
pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", end);

document.querySelectorAll(".sw").forEach(b => b.addEventListener("click", () => {
  color = b.dataset.c; document.querySelectorAll(".sw").forEach(o => o.setAttribute("aria-pressed", o === b));
}));
document.getElementById("undo").addEventListener("click", () => { strokes.pop(); draw(); });
document.getElementById("clear").addEventListener("click", () => { strokes = []; draw(); });

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
document.getElementById("save").addEventListener("click", () => {
  const paths = strokes.map((s, i) => {
    const d = s.pts.map(([x, y], j) => (j ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1)).join(" ");
    return `  <path id="s${i + 1}" d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width}" stroke-linecap="round" stroke-linejoin="round"/>`;
  }).join("\n");
  const intent = document.getElementById("intent").value.trim();
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">\n` +
    (intent ? `  <desc>${esc(intent)}</desc>\n` : "") +
    `  <rect width="512" height="512" fill="#ffffff"/>\n${paths}\n</svg>\n`;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  a.download = (document.getElementById("name").value.trim() || "drawing") + ".svg";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});
draw();
</script>
</body>
</html>
